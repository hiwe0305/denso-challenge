<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc"><title id="title">Health → baseline → chọn can thiệp tiếp theo</title><desc id="desc">Điểm nhấn: quyết định bổ sung có đối chứng, cùng chất lượng và tổng chi phí.</desc>
