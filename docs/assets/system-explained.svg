<text x="395" y="221" font-family="Arial,sans-serif" font-size="20" fill="#465a70">Pretrained VLA + action head</text>
<text x="395" y="248" font-family="Arial,sans-serif" font-size="20" fill="#465a70">Human/video sau gate</text>
<text x="395" y="275" font-family="Arial,sans-serif" font-size="20" fill="#465a70">Target-robot adaptation</text>
<rect x="722" y="125" width="285" height="180" rx="12" fill="#edf7f0" stroke="#36744e" stroke-width="2"/>
<text x="740" y="154" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#36744e">03 · EXECUTION</text>
<text x="740" y="189" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#243244">Robot làm được gì?</text>
