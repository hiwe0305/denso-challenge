<text x="50" y="221" font-family="Arial,sans-serif" font-size="20" fill="#465a70">Human · Internet · Synthetic</text>
<text x="50" y="248" font-family="Arial,sans-serif" font-size="20" fill="#465a70">Teleop robot thật</text>
<text x="50" y="275" font-family="Arial,sans-serif" font-size="20" fill="#465a70">QA, quyền, roots và masks</text>
<rect x="377" y="125" width="285" height="180" rx="12" fill="#edf4ff" stroke="#285ea6" stroke-width="2"/>
<text x="395" y="154" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#285ea6">02 · FLUXVLA</text>
