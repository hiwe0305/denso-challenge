<text x="32" y="385" font-family="Arial,sans-serif" font-size="18" fill="#596b80">Thu / QA thêm</text>
<rect x="32" y="125" width="285" height="180" rx="12" fill="#edf4ff" stroke="#285ea6" stroke-width="2"/>
<text x="50" y="154" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#285ea6">01 · DATA CORE</text>
