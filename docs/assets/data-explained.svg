<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc"><title id="title">Một recording, nhiều views — một lineage</title><desc id="desc">Điểm nhấn: chọn objective theo tín hiệu; derivative giữ split của recording gốc.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#60768c"/></marker></defs>
<rect width="1040" height="720" fill="#ffffff"/>
<text x="32" y="46" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#243244">Một recording, nhiều views — một lineage</text>
<text x="32" y="80" font-family="Arial,sans-serif" font-size="20" fill="#596b80">Điểm nhấn: chọn objective theo tín hiệu; derivative giữ split của recording gốc.</text>
