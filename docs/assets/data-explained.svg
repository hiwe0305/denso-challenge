<text x="352" y="304" font-family="Arial,sans-serif" font-size="18" fill="#596b80">Views chỉ từ training roots</text>
<path d="M520 310V350" fill="none" stroke="#60768c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M860 310V350" fill="none" stroke="#60768c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M180 525V550H350V565" fill="none" stroke="#60768c" stroke-width="3" marker-end="url(#arrow)"/>
