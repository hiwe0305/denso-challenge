[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flywheel-data"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flywheel-contracts"]

[project.optional-dependencies]
egocentric = []

[project.entry-points."flywheel.commands"]
data = "flywheel.data.cli:app"
egocentric = "flywheel.data.egocentric_cli:app"

[tool.uv.sources]
flywheel-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flywheel"]
