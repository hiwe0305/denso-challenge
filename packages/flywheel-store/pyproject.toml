[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flywheel-store"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flywheel-contracts", "duckdb", "pyarrow", "structlog"]

[tool.uv.sources]
flywheel-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flywheel"]
