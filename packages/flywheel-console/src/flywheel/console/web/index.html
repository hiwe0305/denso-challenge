<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flywheel Console</title>
  <link rel="stylesheet" href="style.css?v=20261128rs">
  <script src="vendor/echarts.min.js" defer></script>
  <script type="module" src="app.js?v=20261128rs"></script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main-content"></a>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <header class="top" id="topbar">
    <button type="button" class="topbtn mobile-only" id="menu-toggle" aria-expanded="false" aria-controls="sidebar">☰</button>
    <a class="brand-wrap" href="#/tasks">
      <div class="mark" aria-hidden="true">F</div>
      <div class="brand">
        <span id="brand-title"></span>
        <small id="brand-sub"></small>
      </div>
    </a>

    <div class="top-scope-group">
      <div class="top-scope-field">
        <label class="tiny" for="task-select" id="task-select-label"></label>
        <select class="topbtn" id="task-select"></select>
      </div>
      <div class="top-scope-field">
        <label class="tiny" for="round-select" id="round-select-label"></label>
        <select class="topbtn round-select" id="round-select"></select>
      </div>
    </div>

    <span class="grow"></span>

    <div class="top-controls">
      <button type="button" class="topbtn" id="lock-badge" hidden></button>

      <div class="top-prefs-group">
        <div class="lang-pill" role="group" id="lang-group">
          <button type="button" class="lang-btn" id="lang-vi" data-lang="vi">VI</button>
          <button type="button" class="lang-btn" id="lang-en" data-lang="en">EN</button>
        </div>

        <button type="button" class="topbtn" id="theme-toggle">
          <span aria-hidden="true">◐</span>
          <span id="theme-label" class="top-label"></span>
        </button>
      </div>

      <button type="button" class="topbtn chat-tool-btn" id="chat-toggle" aria-expanded="true" aria-controls="chat-panel">
        <span aria-hidden="true">✦</span>
        <span id="chat-toggle-label"></span>
      </button>
    </div>
  </header>

  <div class="error-banner" id="error-banner" role="alert" hidden>
    <div class="error-banner-body">
      <strong id="error-banner-title"></strong>
      <span class="chip warning mono" id="error-banner-code" hidden></span>
      <span class="error-banner-msg mono" id="error-banner-msg"></span>
    </div>
    <div class="actions">
      <button type="button" class="topbtn" id="error-banner-retry" hidden></button>
      <button type="button" class="topbtn" id="error-banner-close">×</button>
    </div>
  </div>

  <div class="shell" id="workspace-shell">
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

    <aside class="sidebar" id="sidebar">
      <nav id="sidebar-nav"></nav>
    </aside>

    <main id="main-content" tabindex="-1"></main>

    <aside class="chat" id="chat-panel">
      <div class="chat-head">
        <div class="avatar" aria-hidden="true">✦</div>
        <div>
          <b id="chat-pane-title"></b>
          <div class="tiny" id="chat-pane-sub"></div>
        </div>
        <div class="grow"></div>
        <button type="button" class="topbtn" id="chat-close">×</button>
      </div>
      <div class="chat-body" id="chat-body"></div>
    </aside>
  </div>
</body>
</html>
