<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 850" role="img" aria-labelledby="title desc"><title id="title">Kiến trúc task improvement revision2</title><desc id="desc">Task và runtime ghi stage evidence, health và probe để chọn correction hoặc bootstrap; dữ liệu qua QA vào training, kiểm local và toàn task rồi final độc lập. Costs và implementation status giữ riêng.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#7892b0"/></marker></defs><rect width="1220" height="850" fill="#f6f8fc"/><g font-family="Arial, sans-serif"><text x="30" y="42" font-size="25" font-weight="700" fill="#24364d">Task improvement · revision2</text><text x="30" y="72" font-size="15" fill="#6d7d93">Đặc tả đề xuất · G1–G8: các khoảng trống đã bổ sung ở hồ sơ, chưa validation ML</text><rect x="30" y="110" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="47" y="142" font-size="17" font-weight="700" fill="#285ea6">TASK · Chuẩn từng bước — G1</text><text x="47" y="176" font-size="15" fill="#435a75">Entry / completion / readiness</text><text x="47" y="204" font-size="14" fill="#6d7d93">Robot, vùng thao tác, timeout, reset</text><rect x="430" y="110" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="447" y="142" font-size="17" font-weight="700" fill="#285ea6">RUNTIME · Robot thực hiện</text><text x="447" y="176" font-size="15" fill="#435a75">Camera + state + lệnh → policy</text><text x="447" y="204" font-size="14" fill="#6d7d93">Controller thực thi, phản hồi đo được</text><rect x="830" y="110" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="847" y="142" font-size="17" font-weight="700" fill="#285ea6">TRACE / STAGE · Ghi và chấm — G1</text><text x="847" y="176" font-size="15" fill="#435a75">Pass / fail / chưa thử / chưa rõ</text><text x="847" y="204" font-size="14" fill="#6d7d93">Reach, coverage, retry và full-task outcome</text><rect x="30" y="300" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="47" y="332" font-size="17" font-weight="700" fill="#285ea6">HEALTH · Kiểm hệ thống</text><text x="47" y="366" font-size="15" fill="#435a75">Camera, mapping, controller, khả thi</text><text x="47" y="394" font-size="14" fill="#6d7d93">Có lỗi → REPAIR và baseline version mới</text><rect x="430" y="300" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="447" y="332" font-size="17" font-weight="700" fill="#285ea6">PROBE · Khoanh vùng — G2</text><text x="447" y="366" font-size="15" fill="#435a75">So entry chuẩn và entry policy tạo</text><text x="447" y="394" font-size="14" fill="#6d7d93">Lỗi bước trước? Giữ hypothesis/unknown</text><rect x="830" y="300" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="847" y="332" font-size="17" font-weight="700" fill="#285ea6">SELECT / BOOT · Kỹ sư duyệt — G3/G4</text><text x="847" y="366" font-size="15" fill="#435a75">Có base: correction đúng trạng thái</text><text x="847" y="394" font-size="14" fill="#6d7d93">Chưa base: expert seed / curriculum / stop</text><rect x="30" y="490" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="47" y="522" font-size="17" font-weight="700" fill="#285ea6">DATA · Release đúng tín hiệu</text><text x="47" y="556" font-size="15" fill="#435a75">Context qua boundary, action authority</text><text x="47" y="584" font-size="14" fill="#6d7d93">Prior tốt + correction; rights / masks / splits</text><rect x="430" y="490" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="447" y="522" font-size="17" font-weight="700" fill="#285ea6">TRAIN · Cập nhật mô hình — G5</text><text x="447" y="556" font-size="15" fill="#435a75">Native action loss từ parent đã khóa</text><text x="447" y="584" font-size="14" fill="#6d7d93">Pin tham số, sampling, steps và compute</text><rect x="830" y="490" width="360" height="125" rx="9" fill="#fff" stroke="#c4d1e1"/><text x="847" y="522" font-size="17" font-weight="700" fill="#285ea6">CHECK / FREEZE · Đo lại — G6</text><text x="847" y="556" font-size="15" fill="#435a75">Bước + chuyển tiếp + full task + regression</text><text x="847" y="584" font-size="14" fill="#6d7d93">No-gain / chưa rõ; candidate đạt gate mới chốt</text><path d="M393 172H424" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M793 172H824" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M393 362H424" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M793 362H824" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M393 552H424" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M793 552H824" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 238V266H210V297" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 428V456H210V487" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 617V665H750" fill="none" stroke="#7892b0" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="650" width="370" height="100" rx="8" fill="#edf3fb" stroke="#b8cadd"/><text x="398" y="680" font-size="17" font-weight="700" fill="#285ea6">FINAL → BUNDLE · Nghiệm thu độc lập</text><text x="398" y="708" font-size="14" fill="#435a75">Full task từ đầu; owner acceptance và limits</text><text x="398" y="734" font-size="14" fill="#6d7d93">Final không quay lại chọn dữ liệu cùng vòng</text><path d="M1167 553H1204V280H610V297" fill="none" stroke="#bd6875" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="30" y="697" font-size="14" fill="#96707b">CHECK chưa đạt → PROBE / plan / stop</text><rect x="30" y="785" width="1160" height="42" rx="4" fill="#fff4f5"/><text x="48" y="811" font-size="14" fill="#85606a">COST — G7: verifier, probe, reset, bootstrap, QA, train, eval · STATUS — G8: thiết kế / demo / tích hợp / evidence</text></g></svg>