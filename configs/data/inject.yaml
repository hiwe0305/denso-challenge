# configs/data/inject.yaml
# Cấu hình cấy lỗi cho story DA-27 (Design 27/10/2026 mục 9.2, 10)
version: "1.0.0"
seed: 42
injection_rate: 0.08  # 8% (tiêu chí 5-10% số episode)

# 11 loại lỗi dữ liệu (F-DATA: D1-D8)
data_defects:
  drop_frames:
    enabled: true
    drop_rate: 0.15
  timestamp_sync_offset:
    enabled: true
    offset_seconds: 0.08  # Vượt ngưỡng tau_sync (0.033s)
  joint_jump:
    enabled: true
    jump_magnitude: 1.5   # rad/s spike
  joint_limit_exceeded:
    enabled: true
    excess_factor: 1.25   # Vượt giới hạn 25%
  nan_values:
    enabled: true
    nan_ratio: 0.05
  unit_deg_rad:
    enabled: true
    scale: 57.2957795     # 180 / pi
  action_sign_flip:
    enabled: true
    dimensions: [0, 6]    # Chiều action bị đảo dấu
  corrupted_success_label:
    enabled: true
  wrong_task_instruction:
    enabled: true
    corrupted_prompt: "move to random location and stop"
  duplicate_episode:
    enabled: true
  holdout_seed_leak:
    enabled: true
    holdout_seed_range: [9000, 9999]

# Lỗi log huấn luyện (F-TRAIN: T1-T8)
train_defects:
  T1_divergence:
    loss_multiplier: 15.0
  T2_not_learning:
    decay_rate: 0.001
  T3_overfitting:
    val_loss_increase_steps: 5
  T4_group_imbalance:
    frozen_group: "right_arm"
  T5_dead_dimension:
    dim: 12
  T6_mode_collapse:
    std_threshold: 1e-4
  T7_forgetting:
    drop_ratio: 0.40
  T8_gradient_anomaly:
    frozen_grad_norm: 2.5

# Lỗi log inference thời gian thực (F-SYS: R1, R2)
rtc_defects:
  R1_high_latency:
    p99_latency_ms: 120.0  # Vượt ngưỡng 40ms
  R2_buffer_depleted:
    depleted_steps: 10
