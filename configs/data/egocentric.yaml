# Egocentric pipeline (DA-04): pinned EgoDex subset, de-identification waiver,
# segmentation rules, QA thresholds, E-A estimation and labelling models.
# Every number not measured on data is marked "giả định" (assumption) with its source.
# `threshold_version` of each egocentric QAReport is `version` and the first 12 hex
# of the sha256 of this file's bytes.
version: ego-1

sources:
  egodex:
    # Q-27H: the pick-and-place tasks of DA-30's sample (2 lowest episodes per task,
    # test.zip of EgoDex, manifest in egodex-da30/manifest.json). 10 tasks, 20 episodes.
    root: egodex-da30          # under the store root ($FW_ROOT, else ./fwdata)
    split_dir: part1
    episodes_per_task: 2
    tasks:
      - basic_pick_place
      - insert_remove_cups_from_rack
      - pick_place_food
      - pick_up_and_put_down_case_or_bag
      - put_in_take_out_glasses
      - stack_unstack_bowls
      - stack_unstack_cups
      - stack_unstack_plates
      - stock_unstock_fridge
      - vertical_pick_place
    license: CC-BY-NC-ND-4.0   # Apple EgoDex; Q-EGO-LIC still open (design 14)
    data_class: public
    layout: pick_place
    embodiment_id: human_hands@egodex
  ego_video:
    # the team's own recordings: <root>/device.json + <root>/<task>/<i>.mp4
    license: team-internal
    # public from 9/11/2026 (Hiếu): the team's own demo recordings, faces covered by
    # `fw egocentric deid` before any other step; trainable on Colab (docs/g0/egocentric.md 8.1)
    data_class: public
    layout: two_table
    embodiment_id: human_hands@ego_video

deid:
  # DA-04 subtask 8 (8/11/2026): `fw egocentric deid` covers faces on this machine
  # before any other step reads a frame (annotate/deid/blur.py). YuNet of the OpenCV
  # Zoo (MIT), run by OpenCV's FaceDetectorYN on the CPU; no hosted API (internal data).
  model:
    name: opencv_zoo/face_detection_yunet_2023mar
    path: models/yunet/face_detection_yunet_2023mar.onnx   # under the store root
    url: https://github.com/opencv/opencv_zoo/raw/f12e12798e8314f7c074a6656816c048dcc95b7a/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
    revision: f12e12798e8314f7c074a6656816c048dcc95b7a     # last opencv_zoo commit of the file
    sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
  score_threshold: 0.6       # YuNet's default is 0.9; lower keeps more faces; giả định
  nms_threshold: 0.3
  detect_side_px: 960        # frames are scaled to this longer side for detection
  pad: 0.25                  # each box grows by this share of its size on every side; giả định
  hold_frames: 5             # a box also covers this many frames before and after; giả định
  mosaic_cells: 8            # cells across the box's longer side

segment:
  smooth_frames: 5           # moving average of wrist speed and aperture
  still_speed_m_s: 0.12      # wrist slower than this is a dwell; giả định, read off the 20 episodes 6/11/2026
  min_dwell_frames: 3
  min_path_m: 0.2            # a hand whose wrist travels less is not active; giả định
  close_delta_m: 0.01        # aperture change across a dwell that tells grasp (-) from release (+); giả định
  min_confidence: 0.3        # mean pose confidence in a dwell below this is ambiguous; giả định
  min_gap_frames: 6          # two events closer than this are ambiguous; giả định
  model_window_frames: 30    # frames either side of an ambiguous event shown to the model
  model_frames: 8            # frames sampled from that window
  walk_speed_rel: 0.3        # two_table: camera moving above this share of its peak speed; giả định
  steps:
    pick_place:
      pick: "pick up the {object}"
      place: "place the {object}"
    two_table:
      approach: "reach for the {object} on the first table"
      grasp: "grasp the {object}"
      walk: "walk to the other table holding the {object}"
      arrive: "stop at the other table"
      place: "place the {object} on the table"
      release: "release the {object} and step back"

qa:
  # check: threshold and what failing it does. Values are fractions of frames unless
  # named otherwise; a check fails when its value is above the threshold, except
  # min_frames and segment_count (below).
  # A person's review settles segments (DA-04 task 9, 9/11/2026): when every segment is
  # `label_source = human`, segment_ambiguous is 0; one human segment whose sentence is
  # the episode's instruction is a whole-task sample and segment_count needs 1 there.
  min_frames: {threshold: 30, on_fail: reject}                 # 1 s at 30 Hz; giả định
  segment_count: {threshold: 2, on_fail: reject}               # fewer segments than a pick and a place
  video_frames: {threshold: 0, on_fail: reject}                # |frames of the mp4 - frames of the pose|
  pose_finite: {threshold: 0.0, on_fail: reject}               # share of frames whose camera pose is not finite
  hand_pose_nan: {code: D1, threshold: 0, on_fail: flag, when_missing: reject}  # frames with a NaN hand pose;
                                                               # reject only when no frame has a finite hand
  pose_low_confidence: {threshold: 0.5, on_fail: flag, below: 0.3, when_missing: flag}  # giả định
  hand_out_of_frame: {threshold: 0.3, on_fail: flag}           # no wrist inside the image; giả định
  camera_jitter_deg_s: {threshold: 60.0, on_fail: flag}        # RMS high-pass angular speed; giả định
  instruction: {threshold: 0.0, on_fail: reject}               # 1 when the episode has no sentence
  segments: {threshold: 0.0, on_fail: reject}                  # 1 when no segment, or segments overlap or leave the episode
  segment_ambiguous: {threshold: 0.0, on_fail: flag}           # share of events the rule could not settle, no model or person
  deid_gate: {threshold: 0.0, on_fail: reject}                 # 1 when raw and not waived

pose_ea:
  # E-A job (estimate_job.py on rtx3060): MediaPipe Hands + OpenCV monocular VO.
  mediapipe_model: hand_landmarker.task   # float16, storage.googleapis.com/mediapipe-models
  vo_features: 1500
  vo_min_flow_px: 1.0        # below this median flow, rotation only; giả định
  vo_step_m: 0.005           # translation per frame when moving: monocular VO has no scale; giả định (0.15 m/s)
  max_side_px: 960           # frames are downscaled for MediaPipe and VO
  clean:
    # DA-04 task 10 (9/11/2026): `fw egocentric pose --estimates` cleans E-A before it
    # writes pose.npz (ingest/egocentric/clean.py); E-B is never cleaned. Values from the
    # offline test on the tray clips, docs/he/stage1.md 2.8 (PR 171).
    frame: camera            # hands in the camera frame, camera = identity: the VO track
                             # is not measured (translation is vo_step_m per moving frame)
    flip_deg: 30             # turn a wrist frame pi about an axis when that is > 30 deg
                             # closer to the previous seen frame; giả định (2.8)
    jump_mad: 5.0            # steps > median + 5 MAD (x 1.4826) of the clip (wrist,
    jump_burst: 4            # rotation, tips) cut runs; pieces of <= 4 frames that are not
                             # the longest are interpolated, never dropped; giả định (2.8)
    savgol_window: 21        # Savitzky-Golay frames (0.7 s at 30 fps) on wrist position,
    savgol_order: 2          # tips and quaternion; window 9 gave 10.6 %, 15 gave 6.0 %,
                             # 21 gave 3.9 % clipped on the trial export; giả định (2.8)

models:
  # D6: rules first; RoboBrain suggests step boundaries when rules are ambiguous and
  # writes each segment's sentence; Molmo2 points at the grasp. OpenAI-compatible
  # endpoints with images. `served` is the name the endpoint knows the model by:
  # on rtx3060 Ollama 0.32.14 serves the Q4_K_M GGUF builds (6/11/2026); `revision`
  # is the commit of that GGUF repo on Hugging Face.
  segment_suggester:
    name: BAAI/RoboBrain2.5-4B
    served: hf.co/mradermacher/RoboBrain2.5-4B-GGUF:Q4_K_M
    revision: 4967565e14c91e2d14a762f1ec18b4f1a1703786
  labeler:
    name: BAAI/RoboBrain2.5-4B
    served: hf.co/mradermacher/RoboBrain2.5-4B-GGUF:Q4_K_M
    revision: 4967565e14c91e2d14a762f1ec18b4f1a1703786
  grasp_pointer:
    name: allenai/Molmo2-4B
    served: allenai/Molmo2-4B
    revision: 042abfa7a38879a376cec03d949eff0aefaa0600
  timeout_s: 180
  max_image_side_px: 640
  # hosts by name that serve inside our network; IPs that are loopback or private and
  # localhost need no entry. Egocentric frames go to no other host (CLAUDE.md).
  local_hosts: []

review:
  sample_share: 0.2          # share of segments a person reviews; giả định
  seed: 7
