# Thresholds of the replay checks (DA-17 AC 3; design 6.3, 10 D7). Written by
# `python -m flywheel.data.replay_check calibrate`; do not edit by hand, calibrate again.
#
# Every key is required (flywheel.data.replay_check.thresholds.load_thresholds); a
# ReplayThresholds carries version@<first 12 hex of the sha256 of this file>.
# kinematic: at `quantile` of the clean episodes (1.0 = their largest value), since a
#   kinematic issue rejects the episode (qa.yaml replay_kinematic). The timestamp
#   tolerance, min_std and the 1e-5 rad floor of limit_tolerance are fixed in code.
# dynamic: at `quantile` (p99, design 6.3) of the episodes whose replay succeeded; a
#   dynamic issue flags the episode (qa.yaml replay_dynamic).
version: replay-1
calibration: psi-data e78fb93 two-table teleop, 99 episodes; SIMPLE b75c678 decoupled WBC on MuJoCo, sim
  clock; rtx3060 4/11/2026
kinematic:
  quantile: 1.0
  timestamp_tolerance_frames: 0.5
  limit_tolerance:
    action: 1.0e-05
    states: 0.00192734
  unit_ratio:
    hand: 7.81217
    arm: 1.33861
    torso_rpy: 1.31502
  min_std: 0.001
  mapping_correlation:
    right_hand_thumb_0_joint: 0.5
    right_hand_thumb_1_joint: -0.530635
    right_hand_thumb_2_joint: 0.5
    right_hand_index_0_joint: 0.5
    right_hand_index_1_joint: 0.5
    right_hand_middle_0_joint: 0.5
    right_hand_middle_1_joint: 0.5
    left_shoulder_pitch_joint: 0.5
    left_shoulder_roll_joint: -0.117151
    left_shoulder_yaw_joint: 0.5
    left_elbow_joint: 0.5
    left_wrist_roll_joint: 0.5
    left_wrist_pitch_joint: 0.5
    left_wrist_yaw_joint: 0.5
    right_shoulder_pitch_joint: 0.5
    right_shoulder_roll_joint: 0.5
    right_shoulder_yaw_joint: 0.5
    right_elbow_joint: 0.5
    right_wrist_roll_joint: 0.5
    right_wrist_pitch_joint: 0.5
    right_wrist_yaw_joint: 0.5
    waist_roll_joint: 0.5
    waist_pitch_joint: 0.5
    waist_yaw_joint: 0.5
