  representative_seed: 20261112
  reset_runs: 10 # M; step 6 needs a saved sim state at the start of step k
  tau_k: 0.8
  knn_k: 5
  tau_cov: "p95 leave-one-out kNN distance over S70's conditions"
  # Step 6 (reset) is not available: restoring a SIMPLE state at a step boundary is
  # S1-06, cut until after the demo. Clusters go on "not localised" (spec 6.6).
  step6: unavailable
  # Step 7 reruns each representative with level 0 visuals, 3 rollouts each, since one
  # rollout per condition is close to a coin toss on this task (tray.md 18.9).
  step7_rollouts_per_representative: 3

# Spec 7.3 rule 5: C's data budget is B_add. Every demo here is an S1 episode at one unit
# cost, so B_add is counted in episodes: the 181 episodes C_ALL has on top of S70.
budget:
  b_add_episodes: 181 # 606 (ALL) - 425 (S70)
  per_failure_rollouts: 20 # spec 6.10, sim generation around a failure
  per_cluster_cap: 200
  failures_per_cluster_max: 10 # L_t
  order: "g/c with Beta(1,1) priors, ties by earlier first_fail_step; same step: one pool, round-robin per failure"
  train_cap_cu: 80
  eval_cap_cu: 14 # per serve lane
  diagnosis_cap_cu: 8 # step 7 rollouts on one L4 lane

