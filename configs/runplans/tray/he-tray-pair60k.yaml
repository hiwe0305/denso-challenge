  run_plan_id: rp_a04c14e79dfd
  eval_set: rp_a04c14e79dfd-2e57f60
  conditions_sha256: b9c38b37afa6fbdd4027be287df85fe7b016130bd32227f97c876f6bae7d3dfb

interpretation:
  doc: docs/he/tray.md
  rules_marker: pair60k-rules
  rules_sha256: e7f903963f515a63da27ce7c94b825d6310406be2e39dfca445a36be51f2f518 # section 19.2 block, four runs
pricebook: "assumption: Colab 100 CU pack, 0.0999 USD per CU (docs/g0/ledger/DA-19.csv)"

# Hiếu 11/11/2026 01:50 (via the coordinator): both runs at once, so the success numbers
# land on 12/11 (tray.md 19.5). Hiếu 11/11/2026 ("Chốt A100"): one Colab A100 each, both
# branches alike; the new account ran an A100 and an L4 session at once (balance 500 CU).
# Estimate, not measured on this cut: 60000 x 0.47 s/step (A100, S1-04) = 7.83 h, plus
# 30 vals (every 2000 steps) x about 50 s = 0.42 h, plus about 0.2 h setup = about 8.45 h
# at 6.73 CU/h (cu_watch RATES) = about 57 CU each. Cap 70 (coordinator 11/11/2026,
# tray.md 19.8): a safety net, not the spend. No CU is spent idle: he1_fetch.py follow
# --stop-when-done (#186) stops each session once ckpt_60000 matches its sha256 on the
# laptop. The cap sets follow's early-stop line at step 2200: at cap 61 it stopped a run
# above 0.50-0.51 s/step (vals included), and the likely rate is about 0.505 (0.47 x 1.02,
# as full run C on L4 ran 2 % over its short probe, + 0.025 for vals), so both runs could
# be stopped for nothing and miss 12/11. At cap 70 the line is about 0.58-0.59 s/step.
# One cu_watch batch: one guard and one session watcher per run in one registry
# (cu_watch.py supports N sessions per batch); the floor 14 is safe only while the
# balance holds every cap: 14 + 4 x 70 = 294 CU at launch (plus the serve lanes' caps
# once eval starts, tray.md 19.5). Four runs x about 57 CU = about 228 CU (estimate).
budget:
  ceiling_cu: 280
  cap_cu_per_run: 70
  runs: [B_ALL, C_ALL, B_70, C_70]
  watcher: "scripts/colab/cu_watch.py session --gpu A100 --cap 70 --floor 14, one per run, under one guard for the batch; one batch per account"

# Rule (e) of the 19.2 block: ckpt_60000 is the metric; ckpt_40000 an early read only.
checkpoints:
  primary: 60000
  early: 40000

schedule:
  mode: parallel
  floor_cu: 14
  persist: "persist --watch 600 --pid <train pid> to the mounted Drive: every complete ckpt_<step> (trainer/colab.py sync_job, no --delete), so ckpt_40000 stays on Drive while training goes on"
  # All four at once; if Colab refuses the 3rd or 4th session (cu_watch exits 6), the
  # 70 % pair runs as a second wave as soon as the first ends (tray.md 19.5).
  waves: [[B_ALL, C_ALL], [B_70, C_70]]

