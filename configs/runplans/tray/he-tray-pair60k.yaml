# Hiếu 11/11/2026 ("Thêm hai run 70%"): the 70 % runs take 70 % of each part's seeds,
# chosen by the seed alone (pairplan.subset_seeds: seeds ordered by sha256 of str(seed),
# the first ceil(0.7 x n)), never by outcome or quality. From the sizes W1 pinned
# below: ceil(0.7 x 429) + ceil(0.7 x 177) = 301 + 124 = 425 episodes, as W1
# gave. Each part's list is pinned by its sha256 (`pairplan subset` prints the lists),
# before any run. B_70 and C_70 train on the same list.
subsets:
  - name: S70
    fraction: 0.7
    rule: >-
      From each part of ALL, in the cut's order, the first ceil(0.7 x n) seeds of the
      part's set ordered by sha256 of the seed as a decimal string; n is the part's set
      size. No choice by outcome, quality or release order. Normalised with ALL's
      meta/stats_psi0.json (cut.stats_sha256), copied into the subset's dataset, so the
      70 % runs differ from the ALL runs in the amount of data only.
    order: sha256_seed
    stats: cut
    parts:
      # `pairplan subset` on the W1 pins, 11/11/2026; check re-derives both from the sets files
      - {regenerates: tray_s1_f9433b028c52, episodes: 301, seeds_sha256: 5cd4a08ad3c74854a7d82940550f5e2b180870f8ed7643e9f5e2e7d2c572b401}
      - {regenerates: tray_s1_6c0fd7d37f77, episodes: 124, seeds_sha256: 0aa1c409e3866232e7d1c3bf9a680778ab6e95126e0e5b93bd36a5589331c7d4}
    episodes: 425 # 301 + 124
    # sum of `length` in ALL's meta/episodes.jsonl over the S70 seeds (427758 + 176157);
    # the S70 dataset of task 6.3 must report this as meta/info.json total_frames
    frames: 603915

recipe:
  file: configs/models/psi0-stage3.yaml # batch 16, lr 1e-4 cosine, warmup 1000, VLM frozen, RTC
  sha256: 71ba5de8ef22a11432a829e86e93b7e662f5f38f453cca27f73d6fbe777a1dbd # recipe_sha256, no `estimate`
  overrides:
    train.validation_steps: 2000 # PO 4/11/2026 (S1-04 4.1), as v2
    train.max_training_steps: 60000 # Hiếu 11/11/2026: both branches; the cosine runs over 60k
  nproc_per_node: 1 # one Colab A100 per branch (Hiếu 11/11/2026): global batch 16, recipe as on L4
  dataset_stats: own_train_set # ALL's: computed on ALL, used by all four (subsets[].stats: cut)
train_seeds: [0]

branches:
  B_ALL: {parent: psi0-ego-stage1-egx, role: "run 1: stage 1 VLM (W2) on ALL"}
  C_ALL: {parent: psi0-baseline-egodex-he, role: "run 2: C's VLM on ALL; the full-demo mark"}
  B_70: {parent: psi0-ego-stage1-egx, data: S70, role: "run 3: stage 1 VLM on S70"}
  C_70: {parent: psi0-baseline-egodex-he, data: S70, role: "run 4: C's VLM on S70; the baseline of B_70"}

# The paired differences the 19.2 block reads (evidence computes exactly these).
comparisons:
  - {rule: "a′", variant: B_70, baseline: C_70, kind: primary}
  - {rule: f, variant: B_70, baseline: C_ALL, kind: noninferiority, margin: 0.10}
  - {rule: g, variant: C_70, baseline: C_ALL, kind: noninferiority, margin: 0.10}
  - {rule: h, variant: B_ALL, baseline: C_ALL, kind: secondary}

# v2's eval, unchanged (eval_of): 270 episodes per branch (docs/he/tray.md 8.2). Level 0 has one scene: 30 replicates,
# reported apart. Levels 1 and 2: 120 dev seeds each, 240 scenes pooled into the primary
# metric. [1000000, 1000100) is left out: tests and view_scene use seeds there.
# Sim time, the condition seed on reset and lazy frame decode are on master (hotfix
# ee02e0b, flywheel_simple/tray/run.py); the seeded server is docker/psi0/
# serve_psi0_seeded.py (#97), used by scripts/g0/serve_psi0.sh serve (3fc46c5). Still
# open: the GPU determinism check of tray.md 8.5.
eval:
  cli: eval-decoupled-wbc
  sim_mode: mujoco
  renderer: mujoco
  synchronous: true
  split: dev
  clock: sim
  policy_noise: per_episode_condition_seed
  by_level:
    - {level: 0, seeds: {start: 1000100, stop: 1000130}, unit: replicate, headline: false}
    - {level: 1, seeds: {start: 1000100, stop: 1000220}, unit: condition, headline: true}
    - {level: 2, seeds: {start: 1000100, stop: 1000220}, unit: condition, headline: true}
  episode_limit_s: 90.0 # configs/sim/tray.yaml episode_limit_s

metric: {primary: sim_success, per_stage: scorer_7_steps, failure_kinds: design_3_3}
stats: {method: bootstrap_by_condition, resamples: 10000, seed: 20261103, ci: 0.95}

# The eval of v2, condition by condition: its eval set pairs the four runs. The scene
# is the +zone1 scene of DA-33 #182 (target zone drawn), pinned by pinned_files, so neither run is
# paired with eval C or C+ (tray.md 19.2 rule d).
eval_of:
