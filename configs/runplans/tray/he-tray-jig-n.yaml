  # meta/info.json total_frames must equal it (mixplan.cut_problems).
  frames: 1230839
  stats_sha256: 3dae55d7e6d58c262aa38b4c7a6e5f4c201e26e63c2a1e53e25ec05e0f57bb6c # meta/stats_psi0.json of the joined set, task 4.1

recipe:
  file: configs/models/psi0-stage3.yaml # batch 16, lr 1e-4 cosine, warmup 1000, VLM frozen
  sha256: 71ba5de8ef22a11432a829e86e93b7e662f5f38f453cca27f73d6fbe777a1dbd # recipe_sha256, no `estimate`
  overrides:
    train.validation_steps: 2000 # PO 4/11/2026 (S1-04 4.1), as the DA-34 plans
    train.max_training_steps: 100000 # one L4; may change until the freeze (then the checkpoints too)
  nproc_per_node: 1 # one Colab L4 (Hieu 25/11/2026): global batch 16
  dataset_stats: own_train_set
train_seeds: [0]

branches:
  N: {parent: psi0-baseline-egodex-he, role: "run N: the four parts of M and two yaw-offset place cuts joined"}

# Psi0 saves every 10000 steps (checkpointing_steps); the VM keeps the last 5, persist
# copies every complete one to drive.runs. 100000 is the checkpoint the eval reads.
checkpoints:
  primary: 100000
  reads: [60000, 80000]

interpretation:
  doc: docs/he/tray-jig.md # section 6, written before the data of N
  rules_marker: jig-n-rules
  rules_sha256: 7ba9df310fa24e4e90c14ef8f3c08621a759d5b41aa828f59b68a6c41023992d
pricebook: "assumption: Colab 100 CU pack, 0.0999 USD per CU (docs/g0/ledger/DA-19.csv)"

# Estimate, not measured on this data: from run M's measured train (docs/he/tray-jig.md
# section 4: same recipe, batch, step count and GPU), 56.15 CU and about 21 h over two
# sessions, about 4.3 CU of it a VM idle after the end; so about 52 CU and 21 h if one
# session holds. More episodes change the epochs (about 1.3 instead of 1.7), not the steps.
# [Đề xuất] cap 70 CU instead of M's 60: M's measured 56.15 CU came within 4 CU of the
# 60 cap, and a lost VM costs a new setup. With the floor 14 the account must hold at
# least 84 CU at launch (151.83 after M's eval).
budget:
  ceiling_cu: 70
  cap_cu_per_run: 70
  runs: [N]
  watcher: "scripts/colab/cu_watch.py session --gpu L4 --cap 70 --floor 14, under one guard"

schedule:
  mode: sequential
  floor_cu: 14
  persist: "he1_colab.py persist --watch 600 --pid <train pid> --to /content/drive/MyDrive/denso/da50/runs: every complete ckpt_<step> (trainer/colab.py sync_job, no --delete); colab_train restore --branch N brings runs/da50-ft-n-s0 back on a new VM"

drive:
  cuts: denso/da50/cuts # N.tar and N.tar.json (mixplan pack)
  runs: denso/da50/runs # runs/<job> copied by persist, read back by colab_train restore
