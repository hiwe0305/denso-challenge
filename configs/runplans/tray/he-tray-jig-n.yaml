# DA-50: run N, one Psi0 stage 3 fine-tune on the fixed-jig tray scene (DA-41 jig2): a copy
# of run M (he-tray-jig-m.yaml, frozen rp_a410d01efa62) with one change, the dataset.
# Same recipe, parent, step count (100000), train seed 0, own_train_set stats, checkpoints
# and GPU (L4) as M. Frozen 27/11/2026 (task 4.2), lock he-tray-jig-n.lock.json;
# `colab_train --branch N` runs only the plan whose id is MIX_N_FROZEN. A change to any
# pinned value needs a new freeze and a new MIX_N_FROZEN.
#
# Hiếu 26/11/2026 ("Chốt như đề xuất", story DA-50 task 2): add yaw-offset place cuts
# (yaw jitter at CARRY), the new batch weighted towards level 2, no more lateral offsets
# of the same kind. The data was chosen after reading M's failures on its eval set (dev,
# not holdout): see the limits in the jig-n-rules block.
#
# Schema and checks: flywheel_psi0.tray.mixplan, as M.
