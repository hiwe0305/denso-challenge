# Six parts, joined in this order by cplus_cut: the four parts of M in M's order (same
# releases, demo-set files and set hashes; the part folders M was joined from are reused),
# then the two yaw-offset place cuts. Each part is the set Q of one release, Q = the seeds
# of that release's keep file (`demo_sets --keep-seeds`, one file per release split from
# the generation host's {release_id: [seeds]}).
cut:
  name: N
  rule: >-
    From each release, every episode whose final placement error is within 3 cm and
    5 degrees of the jig target (Hiếu 25/11/2026), as listed in that release's keep file;
    no ranking, no cap. First the four parts of run M in M's order (full episodes level 1,
    level 2, then the place cuts), then the two new parts: the place cuts of the yaw-offset
    batch (±15 degrees of yaw at CARRY, planner da41-planner-8+cfg.bee61399+cj.a000s000y150,
    Hiếu 26/11/2026 "Chốt như đề xuất"), level 1 then level 2, same 3 cm / 5 degree keep
    rule. Stats computed once on the joined set (own_train_set).
  parts:
    - release_id: tray_s1_bfbdcbcf719e # store tray-s1-jig2-20261122, level 1 full episodes
      n: 356
