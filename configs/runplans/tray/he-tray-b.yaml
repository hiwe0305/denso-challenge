# DA-34 RunPlan of branch B of the tray experiment, task 4 (AC 5). DRAFT: prepared
# before DA-30's stage 1 checkpoint exists; not frozen, not launched.
#
# Hiếu 9/11/2026 ("Chốt 4 mặc định"): B = branch C of he-tray-v2.yaml (rp_a04c14e79dfd)
# with exactly one change, the VLM parent. B's VLM is C's VLM
# (pre.fast.1by1.2601091803.ckpt.ego200k.he30k) fine-tuned at stage 1 by DA-30 on the
# team's 153 egocentric clips (whole-task clips, faces blurred, data_class public,
# PR #170); its action header, demo set C, recipe, steps, train seed, validation
# override and eval are C's. `variant_of` makes `runplan check` compare every other
# field with v2 and fail on any difference.
#
# Until DA-30 persists its checkpoint, the vlm_stage1 pins are null: `check` passes as
# a draft, `freeze` and `check --launch` refuse (stage1_pending). Then (task 4.7): fill
# job_id, drive_dir, weights_sha256 and manifest_sha256
# (python -m flywheel_psi0.tray.colab_train manifest --folder <folder>, which also checks
# the weights' header against parent_header_sha256), drop status, freeze,
# and set B_FROZEN in colab_train. Reading rules: docs/he/tray.md section 18.2, the
# branch-b-rules block, pinned by sha256 below.
name: he-tray-psi0-b
status: draft
variant_of:
  plan: configs/runplans/tray/he-tray-v2.yaml
  run_plan_id: rp_a04c14e79dfd
  branch: C
purpose: branch_train
story: DA-34
site_id: local
task:
  id: g1_wholebody_tray_transfer_teleop # TASK_UID of flywheel_simple.tray.simple_task
  env_id: simple/G1WholebodyTrayTransferTeleop-v0
  config: configs/sim/tray.yaml
embodiment: g1_sonic_dwbc@1

code:
  simple: {repo: physical-superintelligence-lab/SIMPLE, commit: b75c6786f87b4a7f43b52b0ac5b83a1d9ea62e11}
  psi0: {repo: physical-superintelligence-lab/Psi0, commit: cda3fdfafe47cb6fa75400d013de1bd36e3cea05}

# Revision pinned by S1-03 (docs/g0/psi0-eval.md 1.1), as in version 1.
psi_model: {repo: USC-PSI-Lab/psi-model, revision: cb1480f50d9764ab2f6261bc2e651a67ad54da17}

# C's parent, unchanged: B's stage 1 started from its VLM and B keeps its action header.
parents:
  psi0-baseline-egodex-he:
    vlm:
      path: psi0/pre.fast.1by1.2601091803.ckpt.ego200k.he30k/model.safetensors
      sha256: 6e63da17bdd22430bc07c40e4b14ebb96c9d124d014c532449142862c186d3f9
    action_header:
      path: psi0/postpre.1by1.pad36.2601131206.ckpt.he30k/action_header.safetensors
      sha256: 238b4d95862b0eb44bffa75a2ae69e120aeda3d159fd6f29802dd9338019e14d
    clean_for_main_task: true
    note: >-
      Pretrained on EgoDex 200k + HE 30k steps; the pair the authors fine-tuned their SIMPLE
      checkpoints from. The tray task is new (DA-32), so no tray data is in pretraining.

  psi0-b-ego-stage1:
    vlm_stage1:
      from_parent: psi0-baseline-egodex-he
      story: DA-30
      ledger: docs/g0/ledger/DA-30.csv
      job_id: null # DA-30's stage 1 job on the 153 clips (task 2)
      drive_dir: null # folder under MyDrive: every file of the parent's VLM folder, weights replaced
      weights_sha256: null # model.safetensors of that folder
      manifest_sha256: null # colab_train manifest of the whole folder
      # header of the parent VLM's model.safetensors at psi-model cb1480f (625 BF16 tensors,
      # no lm_head, embed_tokens 153792 x 2048): the stage 1 weights must match it
      parent_header_sha256: 53d000d9626a13faf4bcb5268517b8441c34b187c88c9dee0b4c250dc19d6d59
    action_header:
      path: psi0/postpre.1by1.pad36.2601131206.ckpt.he30k/action_header.safetensors
      sha256: 238b4d95862b0eb44bffa75a2ae69e120aeda3d159fd6f29802dd9338019e14d
    clean_for_main_task: true
    note: >-
      Stage 1 of C's VLM on the team's egocentric clips (people carrying a red box, not
      the sim tray), so no tray scene is in its data either; action header as C's.

# 541 episodes of batch gen/s1-pool-1104 (seeds 1000-1609, level 1), every row planner
# da33-planner-5+cfg.4e2a4505; replay QA 542/542 (docs/he/tray.md section 10).
release:
  id: tray_s1_f9433b028c52
  release_hash: f9433b028c520b4fd78b34469b389862f7b34de0bb185840aa18143d2d5d8461
  location: rtx3060:~/denso-da34-pool/fwdata/releases/tray_s1_f9433b028c52
  data_class: public

# A = 320 > C = 160 > N80 > N40, one hash order (flywheel_psi0.tray.demo_sets). The salt
# is the module's one salt; the order is new because the release hash is. Cut after
# DA-03 QA (7 rejects out) and then the quality filter fixed on 3/11: 429 of 541 kept.
# Only C trains in tier 2; A, N80 and N40 are pinned so a later run needs no new cut.
