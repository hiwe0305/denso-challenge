  stats_sha256: 3c31da5e43acbb22f668e07e3ae4a63643595b248ebc2a3ff745313f82cc85ce # meta/stats_psi0.json of the joined set, task 3.1

recipe:
  file: configs/models/psi0-stage3.yaml # batch 16, lr 1e-4 cosine, warmup 1000, VLM frozen
  sha256: 71ba5de8ef22a11432a829e86e93b7e662f5f38f453cca27f73d6fbe777a1dbd # recipe_sha256, no `estimate`
  overrides:
    train.validation_steps: 2000 # PO 4/11/2026 (S1-04 4.1), as the DA-34 plans
    train.max_training_steps: 100000 # one L4; may change until the freeze (then the checkpoints too)
  nproc_per_node: 1 # one Colab L4 (Hieu 25/11/2026): global batch 16
  dataset_stats: own_train_set
train_seeds: [0]

branches:
  M: {parent: psi0-baseline-egodex-he, role: "run M: the four parts joined"}

# Psi0 saves every 10000 steps (checkpointing_steps); the VM keeps the last 5, persist
# copies every complete one to drive.runs. 100000 is the checkpoint DA-47 evaluates.
checkpoints:
  primary: 100000
  reads: [60000, 80000]

interpretation:
  doc: docs/he/tray-jig.md # written by task 3.2 with the runbook
  rules_marker: jig-m-rules
  rules_sha256: null # pinned by task 3.2
pricebook: "assumption: Colab 100 CU pack, 0.0999 USD per CU (docs/g0/ledger/DA-19.csv)"

# Estimate, not measured on this data: about 40 CU and about 20 h for 100000 steps on an
# L4 (run C of DA-34 measured 15.99 CU and 8.27 h for 40000 steps, x 100/40). An A100 was
# no faster in practice (C70_R1: 11.5 h and 77.27 CU for 60000 steps), so Hieu chose L4 on
# 25/11/2026. [De xuat] cap 60 CU (50 % over the estimate); with the floor 14 the account
# must hold at least 74 CU at launch.
budget:
  ceiling_cu: 60
  cap_cu_per_run: 60
  runs: [M]
  watcher: "scripts/colab/cu_watch.py session --gpu L4 --cap 60 --floor 14, under one guard"

schedule:
  mode: sequential
  floor_cu: 14
  persist: "he1_colab.py persist --watch 600 --pid <train pid> --to /content/drive/MyDrive/denso/da48/runs: every complete ckpt_<step> (trainer/colab.py sync_job, no --delete); colab_train restore --branch M brings runs/da48-ft-m-s0 back on a new VM"

drive:
  cuts: denso/da48/cuts # M.tar and M.tar.json (mixplan pack)
  runs: denso/da48/runs # runs/<job> copied by persist, read back by colab_train restore
