  env_id: simple/G1WholebodyTrayTransferJigTeleop-v0
  config: configs/sim/tray_jig.yaml
embodiment: g1_sonic_dwbc@1

code:
  # SIMPLE b75c678 generated both stores (docs/g0/tray/jig.md 4.12); Psi0 as DA-34
