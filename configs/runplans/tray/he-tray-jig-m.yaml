# DA-48: run M, one Psi0 stage 3 fine-tune on the fixed-jig tray scene (DA-41 jig2) over
# one dataset joined from four demo sets. DRAFT: every pin not known yet is null, so
# `mixplan check` passes as a draft and `mixplan freeze` and `check --launch` refuse and
# list what is missing; `colab_train --branch M` also refuses while MIX_FROZEN is None.
#
# Hiếu 25/11/2026: keep the seeds whose placement error is within 3 cm and 5 degrees,
# train once (no paired control; a control run K on the 498 full episodes alone is
# optional, decided later). Comparison with the DA-34 runs is descriptive only: another
# scene, other data, another step count and another eval env.
#
# Schema and checks: flywheel_psi0.tray.mixplan. Task 3.1 (rtx3060) fills the parts and
# the stats; task 3.2 (freeze PR) writes the reading rules, drops `status`, freezes.
