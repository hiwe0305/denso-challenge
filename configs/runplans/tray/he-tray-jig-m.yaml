        release_hash: 8631ace9b1b31c2febe93d5fd6a974f0c4d87a853040f94bdcecb66558f0e7b1
        location: rtx3060:~/fwdata/datasets/tray-s1-jig2-20261122/releases/tray_s1_8631ace9b1b3
