# Psi0 stage 1 on EgoDex: VLM pre-training with FAST action tokens (DA-30 task 1).
#
# The args of scripts/train/psi0/pretrain-egodex-psi0-fast.sh at the pin cda3fdf
# (the script is still there), except the per-job ones in `job_args`. Same encoding as
# configs/models/psi0-stage1.yaml (DA-19), which holds the HE script instead: this
# file is the recipe the design (section 7.8, 8.1) names for the EgoDex run.
#
# Differences from the script, all per job or per plan, never in `args`:
# * `model.model_name_or_path` is a job arg filled from `parents`: the script starts
#   from Qwen/Qwen3-VL-2B-Instruct (its config default), DA-30 AC 1 from `pre.*`.
# * `train.resume_from_checkpoint` moves to `job_args` (as in DA-19) with
#   `train.skip_resumed_steps`, which the script does not pass; neither changes a
#   fresh run.
# * `data.root-dir` is the export root (`{dataset_root}/{dataset_name}`): Psi0's
#   EgoDexDataset reads <root>/part1..part5 and <root>/extra for train, <root>/test for val.
# * `--timestamp=2605160748` is the authors' run; a job gets its own.
stage: 1
config_module: pretrain_egodex_qwen3vl_config
trainer_module: pretrain # selects psi.trainers.pretrain.PretrainTrainer
source: "scripts/train/psi0/pretrain-egodex-psi0-fast.sh at cda3fdf"

job_args:
  exp: "{exp}"
  seed: "{seed}"
  timestamp: "{timestamp}"
  train.output_dir: "{output_dir}"
  train.resume_from_checkpoint: latest
  train.skip_resumed_steps: true
  data.root-dir: "{dataset_root}/{dataset_name}"
  model.model_name_or_path: "{vlm}"

positional: ["model.action-tokenizer:fast"]

args:
  train.name: pretrain
  train.data_parallel: deepspeed
  # The script reads ${DEEPSPEED_CONFIG:-scripts/deepspeed/zero3.json}; a stage 1
  # RunPlan replaces it by its `deepspeed_config` (Stage1Plan.overrides_at).
  train.deepspeed_config: scripts/deepspeed/zero3.json
  train.mixed_precision: bf16
  train.train_batch_size: 16
  train.max_checkpoints_to_keep: 5
  train.gradient_accumulation_steps: 2
  train.learning_rate: 1e-4
  train.max_training_steps: 1000000
  train.warmup_ratio: "None"
  train.warmup_steps: 0
  train.checkpointing_steps: 5000
  train.validation_steps: 1000
  train.max_grad_norm: 1.0
  train.lr_scheduler_type: constant
  train.lr_scheduler_kwargs.betas: [0.9, 0.999]
  train.lr_scheduler_kwargs.weight_decay: 0.0
  train.lr_scheduler_kwargs.eps: 1e-8
  log.report_to: wandb # WANDB_MODE=offline is set by Psi0Trainer
  log.log_freq: 100
  data.chunk_size: 1
  data.upsample_rate: 3
  data.transform.field.action_norm_type: bounds_q99
  data.transform.field.stat-action-key: egodex
  data.transform.field.stat-path: assets/stats/egodex_stat_all.json
  data.transform.model.resize.size: [270, 480]
  data.use-delta-actions: true
  data.transform.model.no-img-aug: true
  model.action_tokenizer.bins: 2048
  model.action_tokenizer.pretrained_checkpoint: src/fast/egodex-rel-50w-1x48-v2048-s100
  model.tune-mm-llm: true
  model.tune-mm-vision: true
  model.tune-mm-mlp: true
  model.mm_projector_lr: 1e-5
  model.vision_tower_lr: 1e-5

# Stage 1 has no action header. Paths relative to the Psi0 repo root, downloaded from
# Hugging Face USC-PSI-Lab/psi-model. The README lists ego390k as the VLM pre-trained
# on EgoDex for 390k steps; its timestamp 2605160748 is the one in this script, so it is
# this recipe's own output. ckpt200k is the EgoDex-only ablation DA-19's stage 1 uses.
parents:
  psi0-pre-egodex-390k:
    model_name_or_path: cache/checkpoints/psi0/pre.fast.2605160748.ckpt.ego390k
  psi0-pre-egodex-200k:
    model_name_or_path: cache/checkpoints/psi0/pre.fast.egodex.2512241941.ckpt200k

estimate:
  seconds_per_step: 9.0 # assumption for one L4, full VLM with ZeRO-3 CPU offload, not measured (ledger DA-30)
