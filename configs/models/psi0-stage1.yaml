# Psi0 stage 1: VLM pre-training on human egocentric data with FAST action tokens
# (DA-19 task 2). Read only for the demo (design section 8): no stage 1 job runs
# before 17/11; DA-30 uses this recipe for its short EgoDex run.
#
# Args of scripts/train/psi0/pretrain-he-psi0-fast.sh at the pin cda3fdf, except the
# per-job ones in `job_args`. Same encoding as psi0-stage3.yaml.
stage: 1
config_module: pretrain_he_qwen3vl_config
trainer_module: pretrain # selects psi.trainers.pretrain.PretrainTrainer
source: "scripts/train/psi0/pretrain-he-psi0-fast.sh at cda3fdf"

# Per-job args, filled by Psi0Trainer: {exp} {seed} {timestamp} {output_dir} come from
# the TrainSpec and the job directory, {dataset_root} {dataset_name} from the dataset
# URI, {vlm} {action_header} from `parents`. Resume (task 5): rerunning a job with the
# same timestamp makes Psi0 pick up its latest ckpt_<step> and skip consumed batches.
job_args:
  exp: "{exp}"
  seed: "{seed}"
  timestamp: "{timestamp}"
  train.output_dir: "{output_dir}"
  train.resume_from_checkpoint: latest
  train.skip_resumed_steps: true
  data.root-dir: "{dataset_root}"
  model.model_name_or_path: "{vlm}"

# tyro subcommand, passed right after the config module.
positional: ["model.action-tokenizer:fast"]

args:
  train.name: pretrain
  train.data_parallel: deepspeed
  train.deepspeed_config: scripts/deepspeed/zero3.json
  train.mixed_precision: bf16
  train.train_batch_size: 16
  train.max_checkpoints_to_keep: 5
  train.gradient_accumulation_steps: 1
  train.learning_rate: 1e-4
  train.max_training_steps: 1000000
  train.warmup_ratio: "None"
  train.warmup_steps: 0
  train.checkpointing_steps: 100
  train.validation_steps: 0
  train.max_grad_norm: 1.0
  train.lr_scheduler_type: constant
  train.lr_scheduler_kwargs.betas: [0.9, 0.999]
  train.lr_scheduler_kwargs.weight_decay: 0.0
  train.lr_scheduler_kwargs.eps: 1e-8
  log.report_to: wandb
  data.chunk_size: 1
  data.upsample_rate: 3
  data.use-delta-actions: true
  data.transform.repack.action-chunk-size: 1
  data.transform.repack.use-delta-actions: true
  data.transform.repack.robot-type: both
  data.transform.field.action_norm_type: bounds_q99
  data.transform.field.stat-action-key: egodex
  data.transform.field.stat-path: assets/stats/egodex_stat_all.json
  data.transform.model.resize.size: [240, 320]
  data.transform.model.no-img-aug: true
  model.action_tokenizer.bins: 2048
  model.action_tokenizer.pretrained_checkpoint: src/fast/egodex-rel-50w-1x48-v2048-s100
  model.tune-mm-llm: true
  model.tune-mm-vision: true
  model.tune-mm-mlp: true
  model.mm_projector_lr: 1e-5
  model.vision_tower_lr: 1e-5

# Stage 1 has no action header: only model_name_or_path is used.
parents:
  psi0-pre-egodex-200k:
    model_name_or_path: cache/checkpoints/psi0/pre.fast.egodex.2512241941.ckpt200k

estimate:
  seconds_per_step: 1.0 # assumption, not measured
