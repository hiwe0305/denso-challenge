# Checks that tell hypotheses of one cluster apart (DA-43 task 4.3, architecture 20/11/2026
# section 6, B3). Read by `flywheel.eval.agentqa.round.hypotheses`.
#
#   separates  pairs of rule ids the check tells apart; `none` = no rule matched
#   needs      what running the check takes
#   cost_key   key of the cost lookup (task 3.4)
#   cost_rank  ascending = cheaper. An assumed order (giả định) until the ledger lookup
#              of task 3.4 replaces it.
# Changing this file is a new version of the agent: score it again (design 11).

checks:
  - id: log_missing_signals
    name: "Record the signals the label needs in the eval outcome and rerun the cluster's conditions"
    separates:
      - [label_signal_missing, none]
      - [scorer_latch_too_strict, none]
    needs: "an eval rerun of the cluster's conditions with the missing signals logged"
    cost_key: eval_rerun_cluster
    cost_rank: 2

  - id: inspect_latch_on_successes
    name: "Compare the latch signal of the unlatched step on successful rollouts with the scorer threshold"
    separates:
      - [scorer_latch_too_strict, label_signal_missing]
      - [scorer_latch_too_strict, none]
    needs: "the latch signal of the step on the run's successful rollouts (CPU analysis)"
    cost_key: cpu_analysis
    cost_rank: 1

  # Design 19/11 section 5.3 (catalog of checks) and tray.md 20.12. The design's pair
  # "policy vs infeasible" of step 5 has no rule on either side yet, so it is not listed.
  - id: planner_on_failed_conditions
    name: "Run the motion planner on the cluster's failed conditions (spec 6.8 step 5)"
    separates:
      - [weak_skill, coverage_gap]
      - [weak_skill, out_of_domain]
      - [weak_skill, none]
    needs: "a planner run per failed condition of the cluster in the simulator (no GPU)"
    cost_key: planner_rerun
    cost_rank: 3

  - id: coverage_distance_check
    name: "Measure the distance of the cluster's failed conditions to the train conditions against tau_cov (spec 6.8 step 8)"
    separates:
      - [coverage_gap, weak_skill]
      - [coverage_gap, out_of_domain]
      - [weak_skill, out_of_domain]
      - [coverage_gap, none]
      - [out_of_domain, none]
      - [near_miss_placement, coverage_gap]
      - [near_miss_placement, out_of_domain]
      - [place_rests_raised, coverage_gap]
      - [place_rests_raised, out_of_domain]
      - [place_yaw_miss, coverage_gap]
      - [place_yaw_miss, out_of_domain]
      - [tilt_while_carried, coverage_gap]
      - [tilt_while_carried, out_of_domain]
    needs: "the train and eval conditions of the run in the pack (CPU analysis)"
    cost_key: cpu_analysis
    cost_rank: 1

  - id: tracking_error_on_successes
    name: "Compare the tracking error of failed and successful rollouts with the tracking tolerance"
    separates:
      - [controller_tracking, none]
    needs: "the traces of the run's failed and successful rollouts (CPU analysis)"
    cost_key: cpu_analysis
    cost_rank: 1

  - id: inspect_train_log_window
    name: "Read the train log of the checkpoint's job around the non-finite losses"
    separates:
      - [earlier_stage_train, none]
    needs: "the train metrics of the job lineage names for the run (CPU analysis)"
    cost_key: cpu_analysis
    cost_rank: 1
