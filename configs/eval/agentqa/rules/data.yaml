# Hypothesis rules of the data group (DA-43 task 2.4, design 19/11 section 4 `relaxed_sweep`;
# tray.md 19.2 c). Field reference: the header of scorer.yaml. Changing this file is a new
# version of the agent: score it again (design 11).
#
# The facts are `relaxed_sweep`'s, per cluster of the task's relaxed label. `_near_miss` is
# true when the members within the WIDEST tolerance of the task's relaxed grid (position
# widened, yaw kept the scorer's) are a MAJORITY of the cluster; both words are defined by
# the tool, so the rule holds no number. The rule also asks that the measures reproduce the
# scorer at its own tolerance (`_first_grid_matches_scorer`): otherwise the distances it
# reads are not the ones the scorer judged, and the cluster says nothing about precision.
#
# What the rule does not tell apart: a scorer tolerance that is too strict for the task
# also gives near misses. That is a decision on the task's tolerance (the relaxed table is
# shown for it), not a fault the rules can see; the hypothesis spends no data budget while
# a system rule stands for the cluster.
#
# Two rules name the mechanism of a failed placement (relaxed_sweep v2; jig eval "M", where
# both were found by hand). `_rests_raised`: most judged members end with the tray above the
# run's own rest height of successes by more than the task view's margin (it sits on an
# obstacle at the target, e.g. a jig wall, instead of lying in it); the tilt is support, not
# a condition, so the title does not say "tilted". Successes can rest raised too, so the rule
# cites how many do (`{run}_successes_raised` of `{run}_rest_height_reference_successes`) as
# the base rate a reader needs. `_yaw_miss`: most members are off by more yaw than the scorer's tolerance.
# Like `_near_miss`, both words are the tool's, so the rules hold no number.
#
# Order. Hypotheses of one cluster are ranked by group, then by the number of support facts
# that resolve minus contra, then by the order of the rules in the files (hypotheses.py,
# `hypothesize`). The two mechanism rules come first here so a tie goes to them;
# `place_rests_raised` cites nine facts, more than `near_miss_placement`'s six, so it ranks
# above the generic near miss. `place_yaw_miss` and `near_miss_placement` cannot both hold:
# a member within the widest tolerance has its yaw within the scorer's, so the two
# majorities are disjoint.
#
# `tilt_while_carried` reads `signal_presence` v3 (the task view's `carry` label, L-TRAY-TILT
# for the tray): `_tilted_while_carried` is true when most judged members had both hands on
# the tray and the tray on no table when the label was raised, i.e. the tray tilted past the
# scorer's limit (`threshold_tilt_max_deg`, task_lookup) during the carry, not while being
# put down or after a drop. It speaks only for clusters of that label, so it never competes
# with the placement rules above.

rules:
  - id: place_rests_raised
    title: "Most failed placements of this cluster end with the tray resting above the placing surface: it sits on an obstacle at the target instead of lying in it"
    source: "relaxed_sweep v2 (rest height and tilt); spec 6.9 (weak_skill); jig eval M, found by hand"
    group: data
    diagnosis: weak_skill
    note: place_rests_raised
    system: false
    interventions: [teleop_correction]
    when:
      - {fact: "{run}_cluster_{cluster_slug}_rests_raised", is: true}
    support:
      - "{run}_cluster_{cluster_slug}_rests_raised"
      - "{run}_cluster_{cluster_slug}_raised"
      - "{run}_cluster_{cluster_slug}_rest_judged"
      - "{run}_cluster_{cluster_slug}_final_height_median"
      - "{run}_cluster_{cluster_slug}_final_tilt_median"
      - "{run}_rest_height_reference"
      - "{run}_rest_height_reference_successes"
      - "{run}_successes_raised"
      - "relaxed_rest_margin"
    contra: []

  - id: place_yaw_miss
    title: "Most failed placements of this cluster miss the target yaw by more than the scorer's tolerance"
    source: "relaxed_sweep v2 (yaw error); spec 6.9 (weak_skill); jig eval M, found by hand"
    group: data
    diagnosis: weak_skill
    note: place_yaw_miss
    system: false
    interventions: [teleop_correction]
    when:
      - {fact: "{run}_cluster_{cluster_slug}_yaw_miss", is: true}
      - {fact: "{run}_relaxed_first_grid_matches_scorer", is: true}
    support:
      - "{run}_cluster_{cluster_slug}_yaw_miss"
      - "{run}_cluster_{cluster_slug}_yaw_over_tolerance"
      - "{run}_cluster_{cluster_slug}_yaw_error_median"
      - "relaxed_yaw_tolerance"
      - "{run}_relaxed_first_grid_matches_scorer"
    contra: []

  - id: tilt_while_carried
    title: "Most failures of this cluster tilt the tray past the limit while both hands still hold it off the tables: the tray is unsteady in the hands before it is put down, not misplaced"
    source: "signal_presence v3 (carry at the failure); spec 6.9 (weak_skill); jig eval M"
    group: data
    diagnosis: weak_skill
    note: tilt_while_carried
    system: false
    interventions: [teleop_correction]
    when:
      - {fact: "{run}_cluster_{cluster_slug}_tilted_while_carried", is: true}
    support:
      - "{run}_cluster_{cluster_slug}_tilted_while_carried"
      - "{run}_cluster_{cluster_slug}_carried_at_failure"
      - "{run}_cluster_{cluster_slug}_carried_judged"
      - "{run}_cluster_{cluster_slug}_both_hands_at_failure"
      - "{run}_cluster_{cluster_slug}_off_table_at_failure"
      - "{run}_cluster_{cluster_slug}_tilt_at_failure_median"
      - "{run}_cluster_{cluster_slug}_failure_time_median"
      - "threshold_tilt_max_deg"
    contra: []

  - id: near_miss_placement
    title: "Most failed placements of this cluster land near the target: the skill lacks precision rather than aiming at a wrong destination"
    source: "design 19/11 section 4 (relaxed_sweep); spec 6.9 (weak_skill); tray.md 19.2 c"
    group: data
    diagnosis: weak_skill
    note: near_miss_placement
    system: false
    interventions: [teleop_correction]
    when:
      - {fact: "{run}_cluster_{cluster_slug}_near_miss", is: true}
      - {fact: "{run}_relaxed_first_grid_matches_scorer", is: true}
    support:
      - "{run}_cluster_{cluster_slug}_near_miss"
      - "{run}_cluster_{cluster_slug}_relaxed_within_widest"
      - "{run}_cluster_{cluster_slug}_relaxed_distance_median"
      - "{run}_cluster_{cluster_slug}_relaxed_distance_max"
      - "relaxed_position_widest"
      - "{run}_relaxed_first_grid_matches_scorer"
    contra: []
