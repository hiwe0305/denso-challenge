# Limits of the model roles of the round pipeline (DA-43 task 5.2; architecture 20/11 B4).
#
# Part of the agent hash: changing a value is a new agent version. The prompt of a role
# is prompts/<role>.md.

rank:
  max_clusters: 8     # clusters ranked per round, largest first; the rest stay on the code floor
  max_facts: 60       # facts offered per cluster: cited ones first, then by fact id
  # A fact whose value is a boolean, or whose name holds one of these, is a comparison
  # fact: the code compared, so a sentence citing it may compare across units.
  comparison_markers:
    - _above_tau
    - _exceeds_tau
    - _separates_
    - _in_domain
    - _near_miss
    - _within_
    - _matches_
    - _judgeable
    - _largest_drop
    - _over_tolerance   # relaxed_sweep v2: members above the yaw tolerance
    - _raised           # relaxed_sweep v2: members above the rest height plus the margin
