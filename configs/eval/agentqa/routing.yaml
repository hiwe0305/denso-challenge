# Model gateway of the round pipeline (DA-43 task 5.1; architecture 20/11 sections 8, 26).
#
# Local profiles name an endpoint of agent.yaml (models.<endpoint>): the model, its
# revision, its URL and the host check stay there. Hosted profiles live only in
# hosted.yaml, which is off by default. `internal` and `restricted` packs always route
# to a local profile; the config is refused otherwise, and the gateway checks the pack's
# class again on every call.

profiles:
  local_text:
    provider: local_openai
    hosted: false
    endpoint: agent           # Nemotron 3.5 Bolt E4B on the RTX 3060
    max_tokens: 6144          # never above models.agent.max_tokens; the endpoint cuts to it
    timeout_s: 300
  local_vision:
    provider: local_openai
    hosted: false
    endpoint: vision          # Qwen3.5-4B; images reach it with the look role (task 5.2)
    max_tokens: 1024
    timeout_s: 300

# role x data class -> profile. Every cell of a role is required.
routes:
  adjudicate: {public: local_text, internal: local_text, restricted: local_text}
  rank: {public: local_text, internal: local_text, restricted: local_text}
  look: {public: local_vision, internal: local_vision, restricted: local_vision}
  # DA-52, optional: a routing.yaml without it loads; `--investigate` then refuses.
  investigate: {public: local_text, internal: local_text, restricted: local_text}

# Caps of one run, retries included. Assumptions until a round is measured: about 25
# calls and 250k input tokens per round (architecture section 12), with room for the
# one resend per item. DA-52 raised both caps (from 60 calls and 600000 tokens): the
# investigate role's own caps in roles.yaml (40 calls, 400000 input tokens) come on top
# of what the other roles are assumed to use, so a round with --investigate does not
# starve judge. Still assumptions until a round is measured.
budget:
  max_calls: 100
  max_input_tokens: 1000000
  max_usd: 0.0                # local calls cost nothing; raise only with hosted on
  chars_per_token: 2.5        # as agent.yaml limits; estimates a prompt before it is sent

retry:
  retries: 2                  # network or overload errors; never more than 2
  base_delay_s: 2.0           # waits 2 s, then 4 s
