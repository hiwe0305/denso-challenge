# What Agent QA/QC's tools know about the tray task (DA-43, design 2026-11-19 section 4).
#
# Read by `flywheel.eval.agentqa.tools.task`. The tools never import the simulator, so
# the step order, the label rules and the signals each label needs are written here.
# Changing this file is a new version of the agent: score it again (design 11).
#
# Source of the step order and the classes: configs/eval/scorer/tray.yaml (header) and
# design 28/10/2026 section 3.2-3.4. The `implies_step` and `signals` columns are
# assumptions (giả định) taken from docs/he/tray.md 20.3 and 20.11; check them against
# the scorer when DA-42 lands.

task_id: tray
scorer_config: ../../scorer/tray.yaml   # thresholds, relative to this file

# The scorer's seven steps, in the order it latches them.
steps: [approach_a, grasp, lift, carry, reach_b, place, release_stand]

# Units of the thresholds of `scorer_config`, so no fact travels without one
# (the two wrong T4 additions of agent v3 compared numbers of two units).
threshold_units:
  r_reach: m
  approach_zone: m
  h_lift: m
  tilt_max_deg: deg
  contact_grace: s
  target_pos_tol: m
  target_yaw_tol_deg: deg
  still_speed: m/s
  t_stable: s
  episode_limit_s: s

# A success means every step latched.
success_implies_step: release_stand

# Per failure label:
#   implies_step  the last step the robot must have got through for the label to be
#                 raised at all; a rollout with the label whose first unlatched step
#                 comes before it has a broken step chain (tray.md 20.11, H1). null:
#                 the label implies nothing (a timeout can happen anywhere).
#   signals       what an engineer needs to tell a real failure of this kind from a
#                 scorer artefact (tray.md 20.11 H3 and the DA-38 ticket there).
labels:
  L-PLACE-POSE:
    implies_step: reach_b      # the tray ended on table B, off the target zone
    signals: [final_tray_pose, target_pose]
  L-TRAY-TILT:
    implies_step: grasp        # raised only while carrying (tray.md 20.3)
    signals: [failure_t, tray_tilt_at_failure, tray_contact_at_failure, tray_on_table_at_failure]
  L-ONE-HAND:
    implies_step: grasp        # raised only while carrying (tray.md 20.11)
    signals: [failure_t, hand_tray_contact]
  L-PART-DROP:
    implies_step: lift         # a part fell off a tray already lifted
    signals: [failure_t, part_positions]
  L-TIMEOUT:
    implies_step: null
    signals: [cmd_lower, meas_lower, cmd_upper, meas_upper]
  L-BALANCE:
    implies_step: null
    signals: [failure_t, pelvis_height, torso_tilt]
  L-COLLIDE:
    implies_step: null
    signals: [failure_t, collision]
  L-WALK:
    implies_step: null
    signals: [failure_t, cmd_lower, meas_lower]

# Scope of the run-level tracking rules (rules/runtime.yaml, design 19/11 section 5.3 rows
# 3-4; tray.md 20.11 H2). `trace_stats` measures a whole run, so these rules only speak for
# clusters whose label may come from the controller not following the command and whose
# first failed step is one where the robot walks.
#   runtime_labels  a timeout, or a walking failure, may be a controller that does not
#                   track the command. ASSUMPTION (giả định): L-BALANCE and L-COLLIDE are
#                   left out until a case shows the controller behind them.
#   motion_steps    the steps the scorer checks with `approach_zone` (body in front of a
#                   table edge, scorer config: steps 1, 4, 5), i.e. the robot walks.
runtime_labels: [L-TIMEOUT, L-WALK]
motion_steps: [approach_a, carry, reach_b]

# The signal the step-latch check of approach_a needs (tray.md 20.11, DA-37 ticket).
latch_signals:
  approach_a: [palm_handle_distance_min]

# What each artifact kind the agent reads carries, by signal name.
provides:
  scores: [success, step_status, first_failed_step, failure_kind, level]
  trace: [cmd_upper, meas_upper, cmd_lower, meas_lower, t_state, t_image]
  sources: []       # provenance records: no signal of a rollout (listed so it is not "unknown")
  metrics: []       # train log: no signal of a rollout
  outcomes: []      # K1 outcomes: checked rollout by rollout through `signal_measures` below

# Where a signal sits in the K1 outcome (`RolloutOutcome`, contract flywheel.contracts.outcome).
# THE ONE PLACE that names outcome measures: `signal_presence` and `relaxed_sweep` read them
# from here. With an `outcomes` entry for a run, a signal of this map is available for a label
# when every failed rollout of that label in the run carries every name, not null.
#   where  final | extrema (the outcome's measure maps), at_failure (the verdict's), verdict
#          (a field of the verdict itself: failure_t, failure_label, step_latch_t, at_failure)
#   names  measure names; a number ends in its unit (_m, _deg, _rad, _s, _quat, _frac)
# ASSUMPTION (giả định): the names below are defaults until the adapter's export of K1
# outcomes (flywheel_psi0) fixes them; adjust them here, nowhere else.
signal_measures:
  final_tray_pose: {where: final, names: [tray_pos_m, tray_quat]}
  target_pose: {where: final, names: [target_xy_m, target_yaw_rad]}
  failure_t: {where: verdict, names: [failure_t]}
  # at_failure names of the tray export since DA-47 (scorer `simple-tray-predicates@2`)
  tray_tilt_at_failure: {where: at_failure, names: [tilt_deg]}
  tray_contact_at_failure: {where: at_failure, names: [hand_contact_left, hand_contact_right]}
  tray_on_table_at_failure: {where: at_failure, names: [tray_on_table]}
  hand_tray_contact: {where: at_failure, names: [hand_contact_left, hand_contact_right]}
  # the relaxed sweep's: one name in _m (distance to the target), one in _deg (yaw error)
  place_error: {where: final, names: [place_distance_m, place_yaw_error_deg]}

# Relaxed success (tray.md 19.2 c): only this label is relaxed, on this grid; the
# yaw tolerance stays the scorer's. The first position is the scorer's own.
# `signal` names the `signal_measures` entry whose final measures the sweep compares.
#
# Where the tray comes to rest, for the same label: `rest_signal` names the `signal_measures`
# entry with the final tray position (the name in _m, [x, y, z]) and orientation (the name in
# _quat, w x y z). The rest height of reference is the median final z of the run's
# successful rollouts (data, not a constant); a failed rollout rests raised when its final
# z is above that reference by more than `rest_margin_m`.
# ASSUMPTION (giả định): rest_margin_m 0.01 m, read off one run (jig eval "M", 100k): the
# median success rests at the reference, and the raised failures there (tray on the jig
# wall) are 14 mm or more above it. Successes can rest raised too (their count is the fact
# `{run}_successes_raised`), so resting raised is not by itself a failure. Not measured over
# other runs or targets.
relaxed:
  label: L-PLACE-POSE
  position_m: [0.05, 0.075, 0.10, 0.15, 0.20]
  yaw_deg: 10.0
  signal: place_error
  rest_signal: final_tray_pose
  rest_margin_m: 0.01

# How `coverage_distance` reads `Condition.vector` (spec 6.8 step 8): d is the mean distance
# to the k nearest TRAIN conditions of the same level, tau_cov the percentile of the same
# quantity over the train conditions, leave-one-out. k and the percentile are the round
# plan's (`knn_k: 5`, "p95 leave-one-out kNN distance", configs/runplans/tray/round-c70.yaml).
# The scales are the adapter's randomisation widths (flywheel_simple.tray.randomize:
# POSE_JITTER 0.05 m, YAW_JITTER 10 deg, half of GAP_RANGE, SPAWN_JITTER, half of
# PART_MASS_RANGE, half of LIGHT_RANGE), the units its own `distance` counts in.
# Each component is read BY NAME from `Condition.values`, so the order of `vector` does not
# matter. ASSUMPTION (giả định): the component NAMES below, the scales, and the components
# each level varies. No code in flywheel_simple or flywheel_psi0 builds the contract
# `Condition` for the tray (the adapter has its own `Condition` class in
# tray/targets.py and tray/pico/conditions.py), so no file fixes the key names in `values`;
# check them against the conditions entries of a real pack. A missing name makes the level
# not judged, with the name in the reason.
coverage:
  k: 5
  percentile: 95
  pool_levels: true
  components:
    - {name: tray_x, scale: 0.05}
    - {name: tray_y, scale: 0.05}
    - {name: tray_yaw, scale: 0.17453292519943295, periodic: true}   # 10 deg in rad
    - {name: target_x, scale: 0.05}
    - {name: target_y, scale: 0.05}
    - {name: target_yaw, scale: 0.17453292519943295, periodic: true}
    - {name: table_gap, scale: 0.2}      # m, half of 1.6-2.0
    - {name: spawn_x, scale: 0.10}       # m
    - {name: part_mass, scale: 0.025}    # kg, half of 0.03-0.08
    - {name: light_scale, scale: 0.2}    # half of 0.8-1.2
  level_components:
    1: [tray_x, tray_y, tray_yaw, target_x, target_y, target_yaw]
    2: [tray_x, tray_y, tray_yaw, target_x, target_y, target_yaw, table_gap, spawn_x,
        part_mass]
    # light_scale is not a level-2 component here: light is judged by the visual check of
    # spec step 7; kept out so tau_cov matches the round plan's definition.
