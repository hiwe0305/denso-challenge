# The hosted block of the model gateway (DA-43; design 19/11 section 8, hard block 1).
#
# Off by default. While `enabled` is false no hosted profile can be called, whatever
# routing.yaml says. When on, a hosted profile is still refused for any pack that B1
# did not confirm as public (hard blocks 2 and 3). Keys are never written here: a
# profile names the environment variable that holds its key.
#
# Hosted providers are built by the gateway from the profile (round/providers/anthropic.py,
# openai_hosted.py). The `anthropic` kind needs the agentqa-hosted dependency group.
enabled: false

profiles:
  haiku:
    provider: anthropic
    hosted: true
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 6144
    timeout_s: 120
    usd_per_mtok_in: 0.10     # Anthropic price list, checked 3/11/2026 (architecture 12)
    usd_per_mtok_out: 0.50

  ckey_opus:
    # ckey.vn reseller gateway; listed 800 VND per 1M tokens on 23/11/2026, converted at an
    # assumed 25,000 VND per USD; the model behind the id is not verified and reported token
    # counts are not reliable.
    provider: anthropic
    hosted: true
    model: claude-opus-5-5
    base_url: https://api.xah.io
    api_key_env: CKEY_API_KEY
    thinking: false
    max_tokens: 6144
    timeout_s: 180
    usd_per_mtok_in: 0.032
    usd_per_mtok_out: 0.032
