# Ngưỡng kiểm hệ thống F-SYS (R1-R6) của chuỗi chẩn đoán.
# Nguồn định nghĩa: spec v10.5 mục 6.4 (thứ tự kiểm, cách hiệu chỉnh τ);
# design 27/10/2026 mục 10 (bảng F-SYS). Story DA-13 AC 1, 2.
#
# Mọi dòng `# giả định` phải hiệu chỉnh lại trước cổng G4; cách hiệu chỉnh ghi
# ngay trên dòng. Dòng `# chốt` là quyết định đã có, không phải số đo.
#
# Hai nguồn hiệu chỉnh của AC 2, không lẫn nhau:
#   - τ_track, τ_sync: phân vị 99 trên **episode teleop thành công** (dữ liệu
#     của tác giả, rồi teleop bàn phím của DA-16). Câu hỏi: controller và đồng
#     hồ của lượt này có tệ hơn lúc người làm được việc không.
#   - τ_lat: phân vị 99 trên **lần chạy chuẩn ở G0** (cùng máy, cùng cấu hình
#     RTC). Câu hỏi: lượt này có chậm hơn máy vốn chạy được không.
# Ngưỡng lấy từ nguồn nào thì ghi vào RunPlan của lần đo đó.
#
# Không có khóa nào là tùy chọn: thiếu một khóa là lỗi cấu hình, không phải
# giá trị mặc định ngầm (DA-08 AC 3, cùng luật).

signals:
  max_gap_fraction: 0.0    # giả định; 0 nghĩa là một chu kỳ thiếu tín hiệu đã làm mã đó CHƯA RÕ. Hiệu chỉnh: tỉ lệ chu kỳ thiếu trên lần chạy chuẩn G0, nhân 2
  max_dropped_frames: 0    # giả định; "camera mất khung" của spec mục 6.4. Hiệu chỉnh: số khung rơi lớn nhất trên lần chạy chuẩn G0
  min_steps: 10            # chốt: phân vị trên dưới 10 chu kỳ không có nghĩa; trace ngắn hơn là CHƯA RÕ, không phải hệ thống chạy tốt

r1:
  # τ_lat phải ≤ d / hz = 6 / 50 = 0,12 s (d ở r2): trễ trên 0,12 s đã cho
  # delay_steps = ceil(trễ × 50) ≥ 7 > d, tức đã là R2, nên τ_lat lớn hơn thì R1
  # không bao giờ bắn mà không kèm R2 (AC 7). Chốt 6/11/2026 [Hiếu]: 0,10 s;
  # con số vẫn là giả định tới khi hiệu chỉnh trên lần chạy chuẩn G0 (DA-37).
  tau_lat_s: 0.10          # giả định; độ trễ chu kỳ suy luận, đơn vị giây, chunk 0 không tính. Hiệu chỉnh: phân vị 99 của (chunk_received_s - observation_sent_s) trên lần chạy chuẩn G0, giữ ≤ d / hz
  percentile: 99.0         # chốt theo spec mục 6.4 ("phân vị 99 độ trễ chu kỳ suy luận")

r2:
  # Đứng máy là chunk có `delay_steps > rtc_inference_delay_steps` trong log
  # RTC. `delay_steps` = ceil(độ trễ × Hz) do `RTCClient` của DA-19 ghi: số chu
  # kỳ điều khiển một vòng thời gian thực chạy trong lúc chờ chunk. RTC của
  # server chỉ che d hàng đầu của chunk mới (tiếp kế hoạch cũ), nên chunk chờ
  # quá d chu kỳ là chunk robot đứng máy trên phần cứng. Không đọc
  # `buffer_level`: đó là mức buffer lúc gửi request, luôn bằng 0 khi SIMPLE
  # chỉ hỏi server lúc hàng đợi action rỗng. Chunk 0 không tính: client hỏi nó
  # trước khi robot chạy action nào, chờ lúc đó là lúc bắt đầu, không phải đứng
  # máy (`runtime.py`).
  #
  # d là `rtc_inference_delay` của server, không phải max_delay của checkpoint.
  # Ψ₀ cda3fdf, src/psi/deploy/serve_psi0_simple.py:161-171: rtc_mode train
  # (checkpoint train với --model.rtc, chọn tự động khi serve --rtc) mà không
  # có --rtc-inference-delay thì d = max(1, min(Ta // 2, Tp - s, max_delay - 1)),
  # s = --min-exec-horizon, mặc định exec_shift = Ta; dòng 210 từ chối
  # d >= max_delay. Cờ serve của đội (scripts/g0/serve_psi0.sh):
  # --action-exec-horizon 24 --rtc, Tp = action-chunk-size 30, max_delay 8
  # (docs/g0/psi0-eval.md, checkpoint G1WholebodyXMoveBendPickTeleop), nên
  # d = max(1, min(12, 6, 7)) = 6. Server báo d trên `/info`
  # (`rtc_inference_delay`); đổi cờ serve hoặc checkpoint thì tính lại.
  rtc_inference_delay_steps: 6  # chốt 5/11/2026 [Hiếu], quyết định (b): d của server, nguồn ngay trên
  max_underruns: 0         # giả định; số chunk (trừ chunk 0) vượt d được phép, một lần đã là một lần đứng máy nhìn thấy được. Hiệu chỉnh: số lần lớn nhất trên lần chạy chuẩn G0

r3:
  tau_track_upper: 0.10    # giả định; chuẩn của (lệnh gửi - trạng thái đo) thân trên, đơn vị rad. Hiệu chỉnh: phân vị 99 trên episode teleop thành công
  tau_track_lower: 0.15    # giả định; thân dưới (vận tốc gốc, chiều cao, hướng thân) có đơn vị khác thân trên nên ngưỡng riêng. Hiệu chỉnh: phân vị 99 trên episode teleop thành công, có cả đoạn quay (cmd yaw là hướng đích của WBC, đi trước yaw đo khi quay; điểm mở trong story DA-13)
  percentile: 99.0         # giả định; thống kê lấy trên các chu kỳ của episode. Ghi ra đây để hai lần đo khác thống kê không bị so với nhau

r4:
  tau_sync_s: 0.02         # giả định; lệch t_image và t_state, đơn vị giây. Hiệu chỉnh: phân vị 99 trên demo teleop thành công
  # Thống kê là **lệch lớn nhất** trong episode, theo spec mục 6.4 ("lệch thời
  # gian lớn nhất"), không phải phân vị 99 của episode. Hai phân vị khác nhau
  # là có chủ ý: ngưỡng lấy từ dữ liệu tốt, phép đo là lúc tệ nhất của lượt này.

r5:
  # Hai bước (quyết định Q3, 3/11/2026): `CameraParams.reference_sha256` là hash
  # của bản tham chiếu đã ghim ở G0, hook chép từ RunPlan, không phải hash của
  # bộ camera đang có. R5 so hash đó với `reference_sha256` dưới đây, rồi so giá
  # trị với `cameras` trong dung sai, dù hash khớp hay không.
  # chốt 3/11/2026, G0 task hai bàn, SIMPLE b75c678: bản tham chiếu ghim ở
  # docs/g0/camera-reference-two-table.yaml (DA-38, sinh bởi
  # scripts/g0/trace/pin_camera_reference.py từ model MuJoCo đã biên dịch).
  # Kiểm chéo: fov 110° trên 640 px cho fx = 320 / tan(55°) = 224.07. Đổi task
  # hoặc commit SIMPLE thì ghim lại, không sửa tay.
  reference_sha256: fc7f9c90ebbf8c4662fd70e58de5aed668c0fbc5ccfbbd951dce705729cdeea2
  cameras:
    head_stereo_left:
      mount: eye_in_head
      width: 640
      height: 360
      fx: 224.06641222710715
      fy: 224.06641222710715
      cx: 320.0
      cy: 180.0
      pose: [0.05762353911995888, 0.017529990524053574, 0.4298701882362366, 0.6592535452986646, 0.25570444464487047, -0.2557044446448706, -0.6592535452986645]
    head_stereo_right:
      mount: eye_in_head
      width: 640
      height: 360
      fx: 224.06641222710715
      fy: 224.06641222710715
      cx: 320.0
      cy: 180.0
      pose: [0.05762353911995888, -0.03247000947594643, 0.4298701882362366, 0.6592535452986646, 0.25570444464487047, -0.2557044446448706, -0.6592535452986645]
  tolerance_intrinsics_px: 0.5    # giả định; fx, fy, cx, cy, đơn vị pixel
  tolerance_position_m: 0.005     # giả định; vị trí camera so với thân gắn, đơn vị mét
  tolerance_quaternion: 0.01      # giả định; thành phần quaternion, không đơn vị; q và -q là cùng một hướng nên so với dấu gần hơn

r6:
  ok_statuses: ["ok"]      # chốt: `infra_status` của RolloutResult; mọi giá trị khác là lỗi hạ tầng, không tính là lỗi policy (03 mục 4.3 luật 8)
