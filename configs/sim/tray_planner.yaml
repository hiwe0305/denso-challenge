# DA-33 scripted tray planner: phase targets, speeds, tolerances, timeouts.
# Flat `key: number` lines only; read by flywheel_simple.tray.planner (same loader as tray.yaml).
# Wrist and palm positions are in the base frame of flywheel_simple.wbc.upper_body:
# pelvis xy and yaw, origin at pelvis height, x forward, y left, z up; straight waist.
# Units: metres, seconds, m/s, rad/s, degrees.
# Tuned in DA-33 Task 4 with parallel sweeps on rtx3060 (docs/g0/tray/planner.md).

# Palm point (midway between wrist_yaw_link and hand_middle_0_link) in the left wrist
# frame; the right hand is mirrored across its xz plane. Measured from g1_sonic's MJCF.
palm_offset_x: 0.060
palm_offset_y: 0.002
palm_offset_z: -0.014
# Palm-up hold (D-25, Hiếu chose it 3/11/2026 for a human-like pose over the D-19 pinch,
# whose rolled wrists pushed the elbows out; docs/g0/tray/planner.md has all parameter sets):
# wrist rolled -90 deg so the palm faces up under the handle lip (12 x 4 x 2 cm, underside
# 7 cm above the table with the 9 cm tray, D-16), fingers pitched 10 deg down along the bar,
# closing up around its outer edge; elbows hang beside the body. Right hand mirrored.
# Orientation in the tray frame (roll, pitch, yaw). Over 22 episodes (level 1, seeds
# 100-121): pinch (-60, 30, 15) 20, up90 14 (15 with release_dz -0.035), pitch 20 -> 12,
# roll -75 -> 8, palms in (0 or -30) raise the elbows above the shoulders, yaw 30-60 -> 0.
grasp_roll_deg: -90.0
grasp_pitch_deg: 10.0
grasp_yaw_deg: 0.0
# Where Dex3 pinches when it closes, in the left wrist frame (index and middle tips meet
# the thumb there, measured); the planner puts this point on the handle. grip_x swept:
# 0.11 / 0.115 / 0.12 -> 28 / 30 / 29 of 48 before levelling.
# With the palm-up hold, 0.14 / 0.16 / 0.18 -> 12 / 6 / 0 of 22 (the hand slides off the bar).
grip_x: 0.115
grip_y: -0.04
grip_z: 0.0
# Grip point this far further away from the tray than the handle centre (m)...
grasp_dy: 0.01
# ...and this far above it (m). Aiming lower (-0.005, -0.01) did not hook better: 34, 27 of 48.
grasp_dz: 0.0
# GRASP commands the grip points this far inside the grip point; a pinch needs none (the
# squeeze used 0.05).
squeeze: 0.0
# Hand closure while reaching and releasing: open for a pinch.
hand_closure_open: 0.0
# Hand closure at rest (walking to table A, raising the hands, the end): fingers slightly
# curled (D-21). 1 for the squeeze, whose fists stay closed.
hand_closure_rest: 0.3
# GRASP closes the hands once the move has ended with both palms at the grasp targets, or
# after this many seconds; the pinch slides in open first (0 closes at once, as the squeeze
# did). With min-jerk moves (D-20) closing as the hands arrive hooks the lip; swept over 48
# episodes at pregrasp_offset 0.12: 0.6 / 0.5 / 0.45 / 0.4 / 0.35 -> 31 / 33 / 29 / 37 / 36,
# and with smooth_speed 0.3: 0.5 / 0.4 / 0.35 -> 36 / 39 / 40 (1.5 before D-20: 40).
grasp_close_after: 0.35

# APPROACH_A (D-21): walk with the arms in the standing pose (palms 0.25 m ahead at pelvis
# height, fingers 0.35 m ahead, 10 cm under the table top; the robot starts 0.53 m from table
# A's edge) until the pelvis is raise_at from the edge, then stop, raise the palms to the
# ready pose above the table top and walk on once both are ready_clear above it.
# With the palm-up hold's wrists rolling to -45 deg on the way up (D-25), the curled index
# fingers swept into table A's edge at 0.40 in 22 of 22 episodes (seeds 100-121); 0.45 / 0.50
# -> 0 touches, 19 / 21 of 22 succeed.
raise_at: 0.50
# Ready pose: wide enough that the thumbs clear the tray handles (outer ends at +-0.265 m).
# Swept over 48 episodes with the halfway wrists below (y, z): 0.30, 0.26 -> 34;
# 0.32, 0.26 -> 39; 0.34, 0.26 -> 37; 0.30, 0.24 -> 28 (D-20's 0.15, 0.30, 0.30 had the
# wrists at the grasp orientation).
ready_x: 0.15
ready_y: 0.32
ready_z: 0.26
ready_clear: 0.08
# Ready wrists halfway from the standing pose (10, 10, 0 deg measured) to the grasp; REACH
# turns them the rest of the way. Left wrist, base frame (roll, pitch, yaw); right mirrored.
# Over the first 22 episodes at y 0.30, z 0.26: standing (10, 10, 0) -> 0 (thumbs push the
# tray while REACH turns the wrists), halfway -> 18, grasp (-60, 30, 15) -> 15 of 22.
# D-25: halfway to the palm-up hold.
ready_roll_deg: -45.0
ready_pitch_deg: 10.0
ready_yaw_deg: 0.0
standoff: 0.10
# Approach square to the tray (facing its yaw, centred on it) and stop this far short of
# its centre: the knuckles reach ~0.27-0.30 m ahead of the pelvis.
approach_dist: 0.30
vx_approach: 0.2

# REACH, GRASP: pre-grasp this far outside the grip point along the tray's +-y; palms
# count as there within palm_tol (the left arm stalls 2.5-3 cm short of pre-grasp at its
# limit; pre-grasp is only a waypoint); both handle contacts held grasp_hold to leave GRASP.
# RELEASE moves the hands out as far. With min-jerk moves 0.06 left the wrists under the lip
# in RELEASE; 0.10 / 0.12 / 0.14 -> 31 / 33 / 20 of 48 (grasp_close_after 0.5).
pregrasp_offset: 0.12
# ...and this far above it: with the arm sagging ~3 cm the fist's knuckles otherwise rest
# on table A and block the reach.
pregrasp_dz: 0.04
# Station keeping in REACH and GRASP: the base slides back ~5 cm as the arms reach
# forward; step forward at keep_vx (Walk.onnx needs >= 0.1) when it is keep_tol behind.
keep_tol: 0.02
keep_vx: 0.12
palm_tol: 0.04
grasp_hold: 0.3
# Measured-palm correction while reaching, grasping and lifting (arm PD sags 2-3 cm):
# gain per control step, total correction capped at palm_correction_max per hand,
# integrated only while the palm is within palm_correction_window of its target.
palm_correction_gain: 0.1
palm_correction_max: 0.05
palm_correction_window: 0.08

# LIFT, BACK_OFF, TURN.
# The loaded arms reach only part of it (palm 3.5 cm up for a 12 cm target at 0.10).
lift_height: 0.15
# The lift target rises at this speed (m/s); a step jerks the squeezed tray.
lift_speed: 0.05
# LIFT ends once the ramp is done and the tray has stayed above h_lift this long (s).
lift_hold: 0.5
# Hands move this far toward the body over the lift ramp (m); for far trays the loaded arms
# at full reach barely rise.
lift_pull: 0.0
# Levelling from LIFT to LOWER: both wrists turn about the line through the palms by an
# angle integrating level_gain x tray pitch (per step), capped at level_max_deg; 0 = off.
# Swept with the pinch over 48 episodes: 0 -> 35, +0.05 -> 37, +0.15 -> 36, -0.05 -> 1.
level_gain: 0.05
level_max_deg: 20.0
backoff: 0.35
vx_backoff: -0.25
# turn_rate integrates target_yaw; the lower body turns at (error / 0.5) rad/s, max 1.
turn_rate: 0.5
turn_tol_deg: 5.0
# Turn flag sent while walking so the lower body holds the heading (D-10).
heading_hold: 0.1

# CARRY to the base pose that puts the tray on the target zone, ARRIVE_B.
vx_carry: 0.3
vx_min: 0.15
vx_gain: 1.0
vy_gain: 1.0
vy_max: 0.1
carry_tol: 0.03
arrive_speed: 0.05
arrive_hold: 0.5
# ARRIVE_B steps (at keep_vx) until the base is within this of its goal ahead and sideways.
# 1.0 (off) -> 31 of 48 with the pinch, 0.04 -> 35: placement misses 4 -> 0. With D-21 the
# opening hands push the placed tray 2-3 cm, so it needs the margin: 0.04 / 0.03 / 0.02 ->
# 40 / 42 / 48 of 48.
arrive_lat_tol: 0.02

# LOWER, RELEASE, RETREAT.
lower_speed: 0.05
# While lowering, the hands shift the tray onto the target by the xy error left after
# walking, at most place_shift_max (m). RELEASE starts once the tray sits flat on B
# (within place_height_tol of the table top, tilt under place_tilt_deg) for lower_hold (s).
place_shift_max: 0.05
# The shift keeps tracking the tray's error while it is in the air (gain per step): the
# loaded arms pull the tray back as they bend down.
place_gain: 0.1
place_height_tol: 0.005
place_tilt_deg: 3.0
lower_hold: 0.2
# ...or once it has rested on B this long (s), even if the hands keep it a few degrees tilted.
lower_settle: 1.0
# Palm-up hold (D-25): leave LOWER once the held tray is this close above table B (m),
# before the wrists under the handle lip touch the table; 0 = off (lower onto B).
lower_tray_clear: 0.035
release_hold: 0.5
# RELEASE moves the hands this far up (m) as they open and move out; negative drops the
# fingers out from under the handle lip. Palm-up hold over 22 episodes: 0 / -0.02 / -0.035
# -> 14 / 14 / 15 (the wrists under the lip touch table B and tilt the placed tray).
release_dz: 0.0
# ...and this far back toward the robot (m) as they move out (D-25: the palm-up hold's
# wrists caught under the near end of the handle); 0 for the pinch.
release_back: 0.05
# RETREAT walks back this far, until the fingers clear table B, then lowers the hands to rest.
retreat: 0.35
vx_retreat: -0.2

# Minimum-jerk smoothing (D-20): when a phase change moves the nominal wrist targets, the
# commanded wrists move from where they were along a min-jerk profile (bell-shaped speed)
# lasting max(smooth_min_s, distance / smooth_speed, angle / smooth_rot_speed_deg);
# continuous corrections (palm sag, place shift, levelling) pass straight through.
smooth_speed: 0.30
smooth_rot_speed_deg: 60.0
smooth_min_s: 0.6
# Hand closure changes ramp along a min-jerk profile over this many seconds.
hand_close_s: 0.5
# Largest move of one arm joint per control step (rad, 50 Hz), a velocity limit inside the
# arm IK's QP (DA-33, 4/11/2026). Without it, the palm-up hold's wrist (roll on its limit,
# pitch near 90 deg) let the IK reconfigure the arm at up to 14 rad/s while the wrist
# targets moved at 2 rad/s: every episode of release tray_s1_0d84cc87b1e5 had arm action
# steps over psi-data's p99.9 (0.087). Over 40 paired seeds (300000-300039, level 1):
# none 36/40, 0.08 39/40 with no step over 0.087 (docs/g0/tray/wrist-jump.md).
arm_step_max: 0.08
# Planner-6 trial (D-29). Raising the hands (APPROACH_A) and turning the wrists to the
# palm-up pose (REACH) go along a joint-space quintic to one IK goal chosen away from the
# wrist_roll limit, no joint faster than transit_step_max (rad per step); 0 keeps
# planner-5's Cartesian blends. LOWER goes down along a minimum-jerk profile peaking at
# lower_speed to lower_ease (m) past the release height, then on at lower_creep (m/s);
# lower_ease 0 keeps the constant lower_speed.
transit_step_max: 0.08
lower_ease: 0.01
lower_creep: 0.02

# Abort when the tray is below this height (on the floor).
abort_tray_z: 0.4

# Phase timeouts (s).
timeout_approach_a: 15.0
timeout_reach: 5.0
timeout_grasp: 6.0
timeout_lift: 5.0
timeout_back_off: 6.0
timeout_turn: 12.0
timeout_carry: 15.0
timeout_arrive_b: 8.0
timeout_lower: 6.0
timeout_release: 4.0
timeout_retreat: 5.0
