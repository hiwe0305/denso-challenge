# DA-41 locating jig on table B for the tray task (docs/g0/tray/jig.md).
# Flat `key: number` lines only; read by flywheel_simple.tray.jig without PyYAML.
# Kept apart from tray.yaml: frozen DA-34 run plans pin tray.yaml by sha256, and the
# scene without the jig must stay buildable for their evals.
# Jig frame: the target pose on table B; x across the tray (width), y along it (length),
# z up from the table top. Units: metres, degrees.

# Corner guides. Each arm (one along a long side, y; one along a short end, x) is a
# vertical stop wall `clearance` outside the tray footprint, up to `wall_height`, then a
# chamfer leaning outward by `chamfer_deg` from vertical up to `height`. A tray lowered up
# to clearance + (height - wall_height) * tan(chamfer) off centre lands on a chamfer and
# slides in. The wall is taller than the height at which the planner lets go
# (tray_planner.yaml lower_tray_clear 0.035), so the tray is boxed in before the hands
# open: opening hands pushed it 2-3 cm (D-21) and turned it about 5 degrees, which a
# 1.5 cm wall let it ride over (level 1 seeds 1, 2: 10.3 deg off, propped on a chamfer).
# The chamfer then runs up to 6.5 cm, just under the handles (tray_height -
# handle_thickness = 7 cm), lead-in 4.2 cm. Planner-5 on 31 episodes: 25/31 at 6.5 cm,
# 26/31 at 5 cm (lead-in 2.4 cm), 26/31 on the fixed target without the jig
# (docs/g0/tray/jig.md 4.3; the planner after DA-41 task 6 in 4.6). 6.5 cm is kept for
# the larger lead-in towards the policy's place errors (median 7.5 cm, docs/he/tray.md
# 19-20).
clearance: 0.006
height: 0.065
wall_height: 0.035
chamfer_deg: 50.0
thickness: 0.010
side_arm: 0.08
# Long-side arms on the robot's side (+x of the jig frame, towards the corridor); 0 = none.
# With 0.08 there, G1's left elbow came down on that guide while lowering and releasing
# (level 0 seed 0: RELEASE timed out with the elbow on it), so that side is left open: a
# three-sided nest. A tray left short towards the robot is not pushed back.
near_side_arm: 0.0
end_arm: 0.035
# End arms on the robot's side (+x corners); 0 = none. Without them the tray is not
# centred along y or in yaw: 3 of 8 hard seeds placed against 5 of 8 with (planner-5).
near_end_arm: 0.035
# Near end arms, lower than the rest (DA-41 task 6): a wall to near_end_wall, then the
# chamfer up to near_end_height (lead-in 2.4 cm). The palm-up hold keeps each wrist under
# its handle 2-3 cm past the tray's near corner (jig x 0.17-0.19), right over these arms,
# its lowest point ~4 mm above the tray origin. On the full-height chamfer (3.5-6.5 cm)
# the wrists propped the held tray at 4-6 cm or pushed it 4-8 cm sideways onto the far
# chamfer (level 1 seeds 5, 7, 8, 12; level 2 seeds 107, 109). Topping out at 3 cm keeps
# ~1 cm under the wrists when the tray is released at 3.5 cm, and the falling tray's near
# corners still get a lead-in. Tried and dropped (jig.md 3): the chamfered arms moved
# 3.5 cm in from the corner (under the palms: 5 of 8 hard seeds tilted 15 deg); a 3.5 cm
# wall only (trays released 1.5 cm or more off in y landed on its top).
near_end_wall: 0.015
near_end_height: 0.030
# The end arms stop at least this far from the handle footprint (x), so the hands that
# hold the handles from below never meet a guide.
handle_gap: 0.02
# Low-friction guide faces (acetal / PTFE strip). The guides take contact priority, so
# this friction applies to tray-on-guide contacts instead of the tray's 1.0.
friction: 0.2
# Slide pad under the nest, footprint plus clearance, same low friction (0 = no pad).
# Without it the far edge of a tray dropped off centre grips the steel table (1.0) and
# the tray stays propped on a slope. Invisible: the target zone under it still shows.
pad_thickness: 0.002

# Discrete jig positions along table B (y). 1 = one fixed pose (default, DA-41 decision);
# 2 or 3 = the episode's seed picks one of that many slots `slot_spacing` apart. Off by
# default; kept for a later story.
slots: 1
slot_spacing: 0.25
