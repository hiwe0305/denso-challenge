<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#bd2235">
  <title>Tiến độ dự án</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root { --ink: #1f2328; --muted: #59636e; --line: #d8dee4; --bg: #f6f8fa; --card: #ffffff; --brand: #bd2235; --warn-bg: #fff4e5; --warn: #8a4b00; --ok: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6edf3; --muted: #9198a1; --line: #30363d; --bg: #0d1117; --card: #161b22; --brand: #ff7b8a; --warn-bg: #3d2a0f; --warn: #f0b45a; --ok: #3fb950; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 17px; margin: 28px 0 10px; }
    a { color: var(--brand); }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
    .rules { display: grid; gap: 8px; }
    .rule { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 12px; }
    .rule b { margin-right: 6px; }
    .ok { color: var(--ok); }
    .table { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 13px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .bar { height: 6px; background: var(--line); border-radius: 3px; min-width: 80px; }
    .bar span { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
    ul { margin: 4px 0; padding-left: 20px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Tiến độ dự án</h1>
      <span class="muted"><a href="index.html">Về trang chính</a> · Rule: <code>docs/product/08-daily-control.md</code></span>
    </header>
    <p id="meta" class="muted">Đang tải báo cáo…</p>
    <div id="report"></div>
  </main>
  <script src="progress.js"></script>
</body>
</html>
