name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check
      - name: Mypy
        run: uv run mypy packages/flywheel/src
      - name: Pytest
        run: uv run pytest
      - name: Import boundary
        run: uv run lint-imports
