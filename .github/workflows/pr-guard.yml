name: pr-guard

# Rules R6 and R9 of docs/product/08-daily-control.md.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check branch, commits and file scope
        id: guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/repo/pr_guard.py --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$BRANCH"
      - name: Label large PR
        if: always() && steps.guard.outputs.size_large == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "size:large" || echo "Label size:large missing; run scripts/repo/setup_labels.sh"
