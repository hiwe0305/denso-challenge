[project]
name = "denso-humanoid-data-flywheel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flywheel"]

[tool.uv]
package = false

[tool.uv.sources]
flywheel = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["packages/flywheel/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["flywheel"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["packages/flywheel/tests"]

[tool.importlinter]
root_packages = ["flywheel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The Flywheel core must remain independent of adapters and model runtimes"
type = "forbidden"
source_modules = ["flywheel"]
forbidden_modules = [
    "flywheel_lerobot",
    "flywheel_psi0",
    "flywheel_simple",
    "isaacsim",
    "lerobot",
    "mujoco",
    "psi0",
    "simple",
    "torch",
]
